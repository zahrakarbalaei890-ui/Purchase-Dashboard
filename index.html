<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Intelligence</title>
<style>
:root{--nav:#0b1220;--nav2:#111c31;--accent:#16a6a1;--accent2:#2563eb;--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#738096;--line:#e7ebf2;--danger:#dc5a67;--good:#159a69;--warn:#d99120;--shadow:0 12px 32px rgba(24,39,75,.08)}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:285px;background:linear-gradient(180deg,var(--nav),#09101d);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 12px 20px;border-bottom:1px solid #263148;margin-bottom:12px}.brand b{font-size:20px}.brand small{display:block;color:#8fa0ba;margin-top:5px}.navgroup{margin:16px 6px 7px;color:#71809a;font-size:11px;font-weight:bold}.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#d9e1ef;margin:3px 0;text-decoration:none;font-size:13px}.nav:hover,.nav.active{background:linear-gradient(90deg,#17304c,#10283f);color:#fff}.nav .ico{width:22px;text-align:center}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.topTitle{font-size:17px;font-weight:bold}.wrap{padding:25px;max-width:1600px;margin:auto}.hero{background:linear-gradient(135deg,#10243d,#163f55 55%,#116b70);border-radius:22px;color:#fff;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#cbd8e7;font-size:13px}.filters{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.filters select,.filters input,.search{background:#fff;border:1px solid #dce3ed;border-radius:9px;padding:10px 12px;color:var(--text);min-height:42px}.hero .filters select,.hero .filters input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}.hero option{color:#111}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--accent);color:#fff;font-weight:bold}.btn.secondary{background:#eef3f8;color:#26364d}.btn.danger{background:#fff0f1;color:#b33e4a}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.kpi{padding:18px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:23px;font-weight:bold;margin-top:9px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel{padding:18px;margin-bottom:16px;overflow:hidden}.panel h3{margin:0 0 5px;font-size:15px}.panel .desc{color:var(--muted);font-size:11px;margin-bottom:14px}.chart{width:100%;min-height:270px}.bars{display:flex;align-items:flex-end;gap:9px;height:230px;padding:15px 4px 28px;border-bottom:1px solid var(--line)}.barcol{flex:1;min-width:18px;height:100%;display:flex;align-items:flex-end;position:relative}.bar{width:100%;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#2aa7b3,#2563eb);min-height:3px}.barlabel{position:absolute;bottom:-25px;right:50%;transform:translateX(50%);font-size:9px;color:var(--muted);white-space:nowrap}.donut{width:185px;height:185px;border-radius:50%;margin:8px auto;position:relative;background:conic-gradient(#2563eb 0 32%,#16a6a1 32% 54%,#f59e0b 54% 73%,#8b5cf6 73% 87%,#64748b 87% 100%)}.donut:after{content:'';position:absolute;inset:42px;background:#fff;border-radius:50%}.legend{display:grid;gap:7px}.legend div{display:flex;justify-content:space-between;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:6px}.tableWrap{overflow:auto;max-height:560px}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th{position:sticky;top:0;background:#f7f9fc;color:#68758a;text-align:right;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:10px 9px;border-bottom:1px solid #edf0f5;white-space:nowrap}.tbl tr:hover td{background:#fafcfe}.click{color:#1558b5;cursor:pointer}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf7f7;color:#147b79;font-size:10px}.empty{padding:45px;text-align:center;color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:5px 0 14px}.sectionTitle h2{margin:0;font-size:19px}.muted{color:var(--muted)}.itemHead{display:flex;justify-content:space-between;gap:20px;align-items:center}.bigNum{font-size:27px;font-weight:bold}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{padding:13px;background:#f7f9fc;border-radius:11px}.mini b{display:block;font-size:16px;margin-top:4px}.notice{padding:13px 15px;border-radius:11px;background:#fff8e9;color:#7b5b17;font-size:12px;margin-bottom:14px}.success{background:#eaf8f1;color:#146c4b}.dangerBox{background:#fff0f1;color:#963d48}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-size:11px}.tab.active{background:#10243d;color:#fff}.cardLink{padding:15px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.cardLink:hover{border-color:#a8d5d3;box-shadow:var(--shadow)}.cardLink b{display:block;margin-bottom:7px}.cardLink span{font-size:11px;color:var(--muted)}.categoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.footer{padding:20px;color:var(--muted);font-size:10px;text-align:center}.mobileBtn{display:none}
@media(max-width:1050px){.side{width:235px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.categoryGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.side{display:none}.mobileBtn{display:block}.top{padding:0 15px}.wrap{padding:15px}.kpis{grid-template-columns:1fr 1fr}.categoryGrid{grid-template-columns:1fr}.hero h1{font-size:20px}.statGrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>Purchase Intelligence</b><small>سیستم هوشمند تحلیل خرید</small></div><div class="navgroup">اصلی</div><div id="nav"></div><div class="navgroup">دسته‌های خرید</div><div id="catNav"></div><div class="navgroup">ابزارهای تحلیلی</div><div id="toolNav"></div></aside><main class="main"><header class="top"><div><button class="btn secondary mobileBtn" onclick="alert('در موبایل برای منوی کامل، نسخه دسکتاپ باز کنید.')">☰</button><span class="crumb" id="crumb">داشبورد</span></div><div class="topTitle">Purchase Dashboard</div></header><div class="wrap" id="app"></div><div class="footer">داده‌ها از فایل Excel و شیت «کلی» تهیه شده‌اند؛ فروشندگان استثنا در گزارش‌های اصلی وارد نشده‌اند.</div></main></div>
<script>
const state={data:null,view:'dashboard',year:'all',category:'all',search:'',item:null,supplier:null};
const fmt=n=>new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}).format(Number(n||0));
const money=n=>fmt(n)+' ریال';
const compact=n=>{n=Number(n||0); if(Math.abs(n)>=1e9)return (n/1e9).toFixed(1)+' میلیارد'; if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+' میلیون'; if(Math.abs(n)>=1e3)return (n/1e3).toFixed(1)+' هزار'; return fmt(n)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uniq=a=>[...new Set(a.filter(Boolean))];
const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);
const group=(a,k)=>{const m={};a.forEach(x=>{const z=x[k]||'نامشخص';m[z]=(m[z]||[]).concat(x)});return m};
const avg=(a,k)=>a.length?sum(a,k)/a.length:0;
function filtered(){let a=state.data.rows;if(state.year!=='all')a=a.filter(r=>String(r.year)===String(state.year));if(state.category!=='all')a=a.filter(r=>r.category===state.category);if(state.search){const q=state.search.toLowerCase();a=a.filter(r=>[r.item,r.itemCode,r.supplier,r.supplierCode,r.invoice,r.category].join(' ').toLowerCase().includes(q))}return a}
function setView(v,extra={}){Object.assign(state,{view:v,...extra});render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){const main=[['dashboard','🏠','داشبورد مدیریت'],['purchases','🧾','دفتر خریدها'],['items','📦','مرکز کالاها'],['suppliers','👤','مرکز فروشندگان'],['compare','⚖️','مقایسه فروشندگان'],['search','🔎','جستجوی پیشرفته'],['reports','📊','گزارش‌ها'],['whatif','💡','WHAT-IF صرفه‌جویی'],['changes','🔔','What Changed'],['ask','🤖','Ask Data'],['excluded','🚫','فروشندگان استثنا']];document.getElementById('nav').innerHTML=main.map(x=>`<a class="nav ${state.view===x[0]?'active':''}" href="#" onclick="setView('${x[0]}');return false"><span class="ico">${x[1]}</span>${x[2]}</a>`).join('');document.getElementById('catNav').innerHTML=state.data.meta.categories.map(c=>`<a class="nav ${state.view==='category'&&state.category===c?'active':''}" href="#" onclick="setView('category',{category:'${esc(c).replace(/'/g,"\\'")}'});return false"><span class="ico">▸</span>${esc(c)}</a>`).join('');document.getElementById('toolNav').innerHTML=[['pivot','🧩','Pivot تعاملی'],['profile','🪪','شناسنامه کالا']].map(x=>`<a class="nav ${state.view===x[0]?'active':''}" href="#" onclick="setView('${x[0]}');return false"><span class="ico">${x[1]}</span>${x[2]}</a>`).join('')}
function hero(title,sub,controls=true){return `<div class="hero"><h1>${title}</h1><p>${sub}</p>${controls?`<div class="filters"><select id="yearF" onchange="state.year=this.value;render()"><option value="all">همه سال‌ها</option>${uniq(state.data.rows.map(r=>r.year)).sort().map(y=>`<option ${String(state.year)===String(y)?'selected':''} value="${y}">${y}</option>`).join('')}</select><select id="catF" onchange="state.category=this.value;render()"><option value="all">همه دسته‌ها</option>${state.data.meta.categories.map(c=>`<option ${state.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input id="qF" value="${esc(state.search)}" oninput="state.search=this.value;render()" placeholder="جستجوی کالا، فروشنده، کد یا فاکتور…"></div>`:''}</div>`}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function topRows(a,key,n=8){const m=group(a,key);return Object.entries(m).map(([name,rs])=>({name,amount:sum(rs,'amount'),qty:sum(rs,'qty'),count:rs.length,rows:rs})).sort((x,y)=>y.amount-x.amount).slice(0,n)}
function miniBar(data,field='amount'){if(!data.length)return '<div class="empty">داده‌ای وجود ندارد</div>';let mx=Math.max(...data.map(x=>x[field]),1);return `<div class="bars">${data.map(x=>`<div class="barcol" title="${esc(x.name)}: ${fmt(x[field])}"><div class="bar" style="height:${Math.max(2,x[field]/mx*100)}%"></div><div class="barlabel">${esc(x.name).slice(0,13)}</div></div>`).join('')}</div>`}
function lineChart(data){if(!data.length)return '<div class="empty">داده‌ای وجود ندارد</div>';let mx=Math.max(...data.map(x=>x.amount),1),w=900,h=250,p=28;let pts=data.map((x,i)=>[p+i*((w-2*p)/Math.max(1,data.length-1)),h-p-(x.amount/mx)*(h-2*p)]);let poly=pts.map(p=>p.join(',')).join(' ');return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="none"><polyline fill="none" stroke="#2563eb" stroke-width="4" points="${poly}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#16a6a1"><title>${data[i].name}: ${fmt(data[i].amount)}</title></circle>`).join('')}<line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#dfe5ee"/></svg><div style="display:flex;justify-content:space-between;color:#738096;font-size:9px">${data.map(x=>`<span>${x.name}</span>`).join('')}</div>`}
function dashboard(){const a=filtered(), months=topRows(a,'month',12).sort((x,y)=>0);const byMonth={};a.forEach(r=>{const key=r.year+'/'+String(r.month).padStart(2,'0');(byMonth[key]??=[]).push(r)});const md=Object.entries(byMonth).sort().map(([name,rs])=>({name,amount:sum(rs,'amount')}));const cats=topRows(a,'category',8);const sups=topRows(a,'supplier',8);return hero('داشبورد مدیریت','مرکز فرماندهی خرید؛ فیلتر کن، وارد جزئیات شو و از روی نمودارها تصمیم بگیر.')+`<div class="kpis">${kpi('مجموع خرید',money(sum(a,'amount')),a.length+' ردیف خرید')} ${kpi('تعداد فاکتور',fmt(uniq(a.map(x=>x.invoice||x.date+'|'+x.supplier)).length),'بر اساس اطلاعات موجود')} ${kpi('تعداد کالا',fmt(uniq(a.map(x=>x.itemCode||x.item)).length),'کد/عنوان کالا')} ${kpi('تعداد فروشنده',fmt(uniq(a.map(x=>x.supplierCode||x.supplier)).length),'فروشندگان فعال در گزارش')}</div><div class="grid2"><div class="panel"><h3>روند مبلغ خرید</h3><div class="desc">ماه‌به‌ماه بر اساس داده‌های واقعی Excel</div>${lineChart(md)}</div><div class="panel"><h3>سهم هزینه‌ای دسته‌ها</h3><div class="desc">دسته‌ها را برای drill-down انتخاب کن</div>${miniBar(cats)} </div></div><div class="grid2"><div class="panel"><h3>پرمصرف‌ترین / پرهزینه‌ترین کالاها</h3><div class="tabs"><button class="tab active" onclick="document.getElementById('topBox').innerHTML=miniBar(topRows(a,'item',10),'qty')">پرمصرف</button><button class="tab" onclick="document.getElementById('topBox').innerHTML=miniBar(topRows(a,'item',10),'amount')">پرهزینه</button></div><div id="topBox">${miniBar(topRows(a,'item',10),'qty')}</div></div><div class="panel"><h3>فروشندگان برتر</h3><div class="tableWrap"><table class="tbl"><tr><th>فروشنده</th><th>مبلغ</th><th>دفعات</th></tr>${sups.map(x=>`<tr><td class="click" onclick="setView('supplier',{supplier:'${esc(x.name).replace(/'/g,"\\'")}'} )">${esc(x.name)}</td><td>${compact(x.amount)}</td><td>${fmt(x.count)}</td></tr>`).join('')}</table></div></div></div>`}
function purchases(){const a=filtered();return hero('دفتر خریدها',`تمام ردیف‌های خرید در دسترس است؛ جستجو و فیلتر کن. (${fmt(a.length)} ردیف)`)+`<div class="panel"><div class="tableWrap"><table class="tbl"><tr><th>تاریخ</th><th>فروشنده</th><th>کالا</th><th>کد</th><th>دسته</th><th>مقدار</th><th>نرخ</th><th>مبلغ</th></tr>${a.slice(0,1200).map(r=>`<tr><td>${esc(r.date)}</td><td class="click" onclick="setView('supplier',{supplier:'${esc(r.supplier).replace(/'/g,"\\'")}'} )">${esc(r.supplier)}</td><td class="click" onclick="setView('profile',{item:r.itemCode})">${esc(r.item)}</td><td>${esc(r.itemCode)}</td><td>${esc(r.category)}</td><td>${fmt(r.qty)} ${esc(r.unit)}</td><td>${compact(r.unitPrice)}</td><td>${compact(r.amount)}</td></tr>`).join('')}</table></div>${a.length>1200?'<div class="notice">برای سرعت نمایش، ۱۲۰۰ ردیف اول نشان داده شده؛ فیلتر را محدودتر کن.</div>':''}</div>`}
function items(){const a=filtered(), its=topRows(a,'item',9999);its.forEach(x=>x.code=x.rows[0].itemCode);its.sort((x,y)=>y.amount-x.amount);return hero('مرکز کالاها','از اینجا هر کالا را باز کن و وارد شناسنامه کاملش شو.')+`<div class="panel"><div class="tableWrap"><table class="tbl"><tr><th>کد کالا</th><th>عنوان</th><th>دسته</th><th>مقدار</th><th>مبلغ</th><th>دفعات</th><th>تامین‌کننده</th></tr>${its.slice(0,1000).map(x=>`<tr><td>${esc(x.code)}</td><td class="click" onclick="setView('profile',{item:'${esc(x.code).replace(/'/g,"\\'")}'} )">${esc(x.name)}</td><td>${esc(x.rows[0].category)}</td><td>${fmt(x.qty)} ${esc(x.rows[0].unit)}</td><td>${compact(x.amount)}</td><td>${fmt(x.count)}</td><td>${fmt(uniq(x.rows.map(r=>r.supplier)).length)}</td></tr>`).join('')}</table></div></div>`}
function supplierPage(){const a=filtered();const sups=topRows(a,'supplier',9999);return hero('مرکز فروشندگان','پروفایل عملکرد هر فروشنده، مبلغ، دفعات و تنوع کالا.')+`<div class="panel"><div class="tableWrap"><table class="tbl"><tr><th>کد</th><th>فروشنده</th><th>مبلغ خرید</th><th>دفعات</th><th>کالاهای متفاوت</th><th>دسته‌ها</th></tr>${sups.slice(0,800).map(x=>{const r=x.rows[0];return `<tr><td>${esc(r.supplierCode)}</td><td class="click" onclick="setView('supplier',{supplier:'${esc(x.name).replace(/'/g,"\\'")}'} )">${esc(x.name)}</td><td>${compact(x.amount)}</td><td>${fmt(x.count)}</td><td>${fmt(uniq(x.rows.map(r=>r.itemCode||r.item)).length)}</td><td>${fmt(uniq(x.rows.map(r=>r.category)).length)}</td></tr>`}).join('')}</table></div></div>`}
function profile(){let code=state.item;let a=state.data.rows.filter(r=>(r.itemCode||r.item)===code);if(!a.length){a=state.data.rows.filter(r=>r.item===code)}if(!a.length)return hero('شناسنامه کالا','کالا پیدا نشد.',false)+'<div class="panel empty">از مرکز کالاها یک کالا انتخاب کن.</div>';a.sort((x,y)=>x.date.localeCompare(y.date));const last=a[a.length-1], first=a[0], prices=a.filter(x=>x.unitPrice>0);const uniqueSup=uniq(a.map(x=>x.supplier));const bySup=topRows(a,'supplier',5);const priceChanges=[];for(let i=1;i<a.length;i++){if(a[i].unitPrice&&a[i-1].unitPrice){priceChanges.push({date:a[i].date,delta:a[i].unitPrice-a[i-1].unitPrice,pct:(a[i].unitPrice/a[i-1].unitPrice)-1})}}const maxChange=priceChanges.slice().sort((x,y)=>Math.abs(y.pct)-Math.abs(x.pct))[0];const monthMap={};a.forEach(r=>(monthMap[r.year+'/'+String(r.month).padStart(2,'0')]??=[]).push(r));const trend=Object.entries(monthMap).sort().map(([name,rs])=>({name,amount:sum(rs,'amount')}));return hero('شناسنامه کالا',`${esc(last.item)} — تاریخچه واقعی خرید، تامین‌کنندگان، نرخ و رفتار قیمت.`,false)+`<div class="panel"><div class="itemHead"><div><div class="tag">${esc(last.category)}</div><h2>${esc(last.item)}</h2><div class="muted">کد کالا: ${esc(last.itemCode)} | واحد: ${esc(last.unit)}</div></div><div class="bigNum">${compact(sum(a,'amount'))}</div></div></div><div class="statGrid">${['دفعات خرید|'+a.length,'مقدار کل|'+fmt(sum(a,'qty'))+' '+esc(last.unit),'آخرین نرخ|'+compact(last.unitPrice),'میانگین نرخ|'+compact(avg(prices,'unitPrice'))].map(x=>{let q=x.split('|');return `<div class="mini"><span class="muted">${q[0]}</span><b>${q[1]}</b></div>`}).join('')}</div><div class="grid2" style="margin-top:16px"><div class="panel"><h3>روند مبلغ خرید</h3>${lineChart(trend)}</div><div class="panel"><h3>تامین‌کنندگان اصلی</h3><div class="tableWrap"><table class="tbl"><tr><th>فروشنده</th><th>مبلغ</th><th>سهم</th></tr>${bySup.map(x=>`<tr><td>${esc(x.name)}</td><td>${compact(x.amount)}</td><td>${fmt(x.amount/sum(a,'amount')*100)}%</td></tr>`).join('')}</table></div></div></div>${maxChange?`<div class="notice ${maxChange.pct>0?'dangerBox':'success'}">بیشترین تغییر نرخ ثبت‌شده: ${fmt(Math.abs(maxChange.pct)*100)}٪ در ${esc(maxChange.date)} (${maxChange.pct>0?'افزایش':'کاهش'}).</div>`:''}<div class="panel"><h3>جزئیات خرید — همان چیزی که در شناسنامه Excel داشتی</h3><div class="tableWrap"><table class="tbl"><tr><th>تاریخ</th><th>فروشنده</th><th>فاکتور</th><th>مقدار</th><th>نرخ</th><th>تغییر نرخ</th><th>فاصله</th><th>مبلغ</th></tr>${a.map((r,i)=>{let prev=a[i-1];let pct=prev&&prev.unitPrice?r.unitPrice/prev.unitPrice-1:null;return `<tr><td>${esc(r.date)}</td><td>${esc(r.supplier)}</td><td>${esc(r.invoice)}</td><td>${fmt(r.qty)} ${esc(r.unit)}</td><td>${compact(r.unitPrice)}</td><td>${pct==null?'—':fmt(pct*100)+'%'}</td><td>${prev?dateDiff(prev.date,r.date)+' روز':'—'}</td><td>${compact(r.amount)}</td></tr>`}).join('')}</table></div></div>`}
function dateDiff(a,b){const p=x=>{let z=x.match(/(\d+)\/(\d+)\/(\d+)/);return z?Number(z[1])*372+Number(z[2])*31+Number(z[3]):0};return Math.max(0,p(b)-p(a))}
function supplierProfile(){const a=state.data.rows.filter(r=>r.supplier===state.supplier);if(!a.length)return hero('پروفایل فروشنده','پیدا نشد.',false);const byCat=topRows(a,'category',8),byItem=topRows(a,'item',8);return hero('DNA فروشنده',`${esc(state.supplier)} — رفتار خرید، تمرکز کالا و سابقه همکاری.`,false)+`<div class="kpis">${kpi('مجموع خرید',compact(sum(a,'amount')))}${kpi('دفعات خرید',fmt(a.length))}${kpi('کالاهای متفاوت',fmt(uniq(a.map(r=>r.itemCode||r.item)).length))}${kpi('دسته‌های فعالیت',fmt(uniq(a.map(r=>r.category)).length))}</div><div class="grid2"><div class="panel"><h3>ترکیب خرید بر اساس دسته</h3>${miniBar(byCat)}</div><div class="panel"><h3>کالاهای اصلی</h3><div class="tableWrap"><table class="tbl"><tr><th>کالا</th><th>مبلغ</th><th>دفعات</th></tr>${byItem.map(x=>`<tr><td>${esc(x.name)}</td><td>${compact(x.amount)}</td><td>${fmt(x.count)}</td></tr>`).join('')}</table></div></div></div><div class="panel"><h3>تاریخچه تراکنش‌ها</h3><div class="tableWrap"><table class="tbl"><tr><th>تاریخ</th><th>کالا</th><th>مقدار</th><th>نرخ</th><th>مبلغ</th></tr>${a.sort((x,y)=>y.date.localeCompare(x.date)).slice(0,500).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.item)}</td><td>${fmt(r.qty)} ${esc(r.unit)}</td><td>${compact(r.unitPrice)}</td><td>${compact(r.amount)}</td></tr>`).join('')}</table></div></div>`}
function compare(){const items=topRows(filtered(),'item',9999);const selected=state.item||items[0]?.rows[0]?.itemCode;const a=state.data.rows.filter(r=>r.itemCode===selected);const sups=topRows(a,'supplier',9999);return hero('مقایسه فروشندگان','یک کالا را انتخاب کن و تامین‌کننده‌ها را کنار هم ببین.',false)+`<div class="panel"><select onchange="state.item=this.value;render()"><option value="">انتخاب کالا</option>${items.slice(0,1000).map(x=>`<option value="${esc(x.rows[0].itemCode)}" ${selected===x.rows[0].itemCode?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="panel"><div class="tableWrap"><table class="tbl"><tr><th>فروشنده</th><th>دفعات</th><th>مقدار</th><th>مبلغ</th><th>میانگین نرخ</th><th>آخرین نرخ</th></tr>${sups.map(x=>{const ps=x.rows.filter(r=>r.unitPrice>0);const last=x.rows.slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return `<tr><td>${esc(x.name)}</td><td>${fmt(x.count)}</td><td>${fmt(x.qty)}</td><td>${compact(x.amount)}</td><td>${compact(avg(ps,'unitPrice'))}</td><td>${compact(last?.unitPrice)}</td></tr>`}).join('')}</table></div></div>`}
function searchPage(){return hero('جستجوی پیشرفته','ترکیب چند شرط برای رسیدن به ردیف‌های دقیق خرید.')+`<div class="panel"><div class="filters"><input id="s1" placeholder="کد فروشنده / نام فروشنده"><input id="s2" placeholder="کد کالا / عنوان کالا"><input id="min" type="number" placeholder="حداقل مبلغ"><input id="max" type="number" placeholder="حداکثر مبلغ"><button class="btn" onclick="advancedSearch()">جستجو</button></div></div><div id="adv"></div>`}
function advancedSearch(){const a=state.data.rows.filter(r=>{let q=(document.getElementById('s1').value||'').toLowerCase(),i=(document.getElementById('s2').value||'').toLowerCase(),mn=Number(document.getElementById('min').value||-Infinity),mx=Number(document.getElementById('max').value||Infinity);return (!q||[r.supplier,r.supplierCode].join(' ').toLowerCase().includes(q))&&(!i||[r.item,r.itemCode].join(' ').toLowerCase().includes(i))&&r.amount>=mn&&r.amount<=mx});document.getElementById('adv').innerHTML=`<div class="panel"><b>${fmt(a.length)} نتیجه</b><div class="tableWrap"><table class="tbl"><tr><th>تاریخ</th><th>فروشنده</th><th>کالا</th><th>مبلغ</th><th>دسته</th></tr>${a.slice(0,1000).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.supplier)}</td><td>${esc(r.item)}</td><td>${compact(r.amount)}</td><td>${esc(r.category)}</td></tr>`).join('')}</table></div></div>`}
function reports(){const a=filtered();const cats=topRows(a,'category',12), months={};a.forEach(r=>{let k=r.year+'/'+String(r.month).padStart(2,'0');(months[k]??=[]).push(r)});const md=Object.entries(months).sort().map(([name,rs])=>({name,amount:sum(rs,'amount')}));return hero('گزارش‌ها','گزارش‌های مدیریتی و تحلیلی بر پایه همان منطق داشبورد Excel.',false)+`<div class="grid2"><div class="panel"><h3>روند خرید</h3>${lineChart(md)}</div><div class="panel"><h3>سهم هزینه‌ای دسته‌بندی</h3>${miniBar(cats)}</div></div><div class="panel"><h3>رتبه‌بندی دسته‌ها</h3><div class="tableWrap"><table class="tbl"><tr><th>رتبه</th><th>دسته</th><th>مبلغ</th><th>مقدار</th><th>دفعات</th><th>سهم</th></tr>${cats.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${compact(x.amount)}</td><td>${fmt(x.qty)}</td><td>${fmt(x.count)}</td><td>${fmt(x.amount/sum(a,'amount')*100)}%</td></tr>`).join('')}</table></div></div>`}
function whatif(){const a=filtered();const pct=Number(state._pct||5),saving=sum(a,'amount')*pct/100;const cats=topRows(a,'category',10);return hero('WHAT-IF خرید','سناریوی کاهش قیمت را روی سابقه واقعی خرید شبیه‌سازی کن.',false)+`<div class="panel"><label>درصد کاهش فرضی قیمت: <b id="pctv">${pct}</b>%</label><input style="width:100%" type="range" min="0" max="30" step="0.5" value="${pct}" oninput="state._pct=this.value;render()"></div><div class="kpis">${kpi('خرید در بازه',compact(sum(a,'amount')))}${kpi('صرفه‌جویی بالقوه',compact(saving))}${kpi('خرید پس از کاهش',compact(sum(a,'amount')-saving))}${kpi('برآورد سالانه',compact(saving))}</div><div class="panel"><h3>جزئیات صرفه‌جویی به تفکیک دسته</h3><div class="tableWrap"><table class="tbl"><tr><th>دسته</th><th>خرید</th><th>صرفه‌جویی</th><th>سهم</th></tr>${cats.map(x=>`<tr><td>${esc(x.name)}</td><td>${compact(x.amount)}</td><td>${compact(x.amount*pct/100)}</td><td>${fmt(x.amount/sum(a,'amount')*100)}%</td></tr>`).join('')}</table></div></div>`}
function changes(){const c=state.data.meta.whatChanged||{};const a=state.data.rows;const recent=[];const byItem=group(a,'itemCode');Object.entries(byItem).forEach(([code,rs])=>{rs.sort((x,y)=>x.date.localeCompare(y.date));for(let i=1;i<rs.length;i++){if(rs[i].unitPrice&&rs[i-1].unitPrice&&rs[i].unitPrice!==rs[i-1].unitPrice)recent.push({item:rs[i].item,date:rs[i].date,pct:rs[i].unitPrice/rs[i-1].unitPrice-1,from:rs[i-1].unitPrice,to:rs[i].unitPrice})}});recent.sort((x,y)=>Math.abs(y.pct)-Math.abs(x.pct));return hero('What Changed','هم تغییرات ثبت‌شده توسط Excel و هم تغییرات قیمت قابل استخراج از تاریخچه خرید.',false)+`<div class="kpis">${Object.entries(c).map(([k,v])=>kpi(k,fmt(v),'ثبت‌شده در آخرین Update')).join('')}</div><div class="panel"><h3>بیشترین تغییرات نرخ در تاریخچه خرید</h3><div class="tableWrap"><table class="tbl"><tr><th>کالا</th><th>تاریخ</th><th>نرخ قبل</th><th>نرخ جدید</th><th>تغییر</th></tr>${recent.slice(0,30).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.date)}</td><td>${compact(x.from)}</td><td>${compact(x.to)}</td><td class="${x.pct>0?'click':''}">${fmt(x.pct*100)}%</td></tr>`).join('')}</table></div></div>`}
function ask(){return hero('Ask Data','از داده‌های خرید سؤال بپرس؛ پرسش‌های فارسی ساده را هم می‌فهمد.',false)+`<div class="panel"><input id="askq" class="search" style="width:100%" placeholder="مثلاً: بیشترین خرید مربوط به کدام فروشنده است؟"><div class="tabs" style="margin-top:12px"><button class="tab" onclick="document.getElementById('askq').value='بیشترین خرید مربوط به کدام فروشنده است؟';askRun()">نمونه ۱</button><button class="tab" onclick="document.getElementById('askq').value='گران‌ترین کالاها کدامند؟';askRun()">نمونه ۲</button><button class="tab" onclick="document.getElementById('askq').value='در سال 1405 چقدر خرید داشتیم؟';askRun()">نمونه ۳</button></div><button class="btn" onclick="askRun()">پاسخ بده</button></div><div id="askans"></div>`}
function askRun(){const q=(document.getElementById('askq').value||'').toLowerCase(),a=state.data.rows;let out='';if(q.includes('فروشنده')&&q.includes('بیشترین')){const x=topRows(a,'supplier',1)[0];out=`<div class="panel"><h3>پاسخ</h3><p>بیشترین مبلغ خرید مربوط به <b>${esc(x.name)}</b> است: <b>${compact(x.amount)}</b> در ${fmt(x.count)} ردیف.</p></div>`}else if(q.includes('گران')||q.includes('پرهزینه')){const xs=topRows(a,'item',5);out=`<div class="panel"><h3>۵ کالای پرهزینه</h3><ol>${xs.map(x=>`<li>${esc(x.name)} — ${compact(x.amount)}</li>`).join('')}</ol></div>`}else if(q.includes('سال')&&q.match(/140[0-9]/)){const y=q.match(/140[0-9]/)[0],x=a.filter(r=>String(r.year)===y);out=`<div class="panel"><h3>پاسخ برای سال ${y}</h3><p>مجموع خرید: <b>${compact(sum(x,'amount'))}</b> در ${fmt(x.length)} ردیف.</p></div>`}else{out=`<div class="panel notice">برای شروع، درباره مبلغ خرید، فروشنده، کالا یا سال سؤال بپرس. پرسش‌های پیشرفته‌تر را هم می‌توانیم در نسخه بعدی به موتور پرسش‌وپاسخ واقعی وصل کنیم.</div>`}document.getElementById('askans').innerHTML=out}
function excluded(){const a=state.data.excludedRows||[];const by=topRows(a,'supplier',20);return hero('فروشندگان استثنا','این تراکنش‌ها عمداً از تمام گزارش‌های اصلی حذف شده‌اند و فقط اینجا نمایش داده می‌شوند.',false)+`<div class="notice dangerBox">تعداد فروشندگان استثنا: ${fmt(state.data.excludedSuppliers.length)} | تعداد ردیف‌های حذف‌شده: ${fmt(a.length)}</div><div class="kpis">${kpi('مجموع خرید حذف‌شده',compact(sum(a,'amount')))}${kpi('تعداد ردیف',fmt(a.length))}${kpi('فروشندگان',fmt(by.length))}${kpi('کالاهای متفاوت',fmt(uniq(a.map(r=>r.itemCode||r.item)).length))}</div><div class="panel"><h3>خلاصه فروشندگان استثنا</h3><div class="tableWrap"><table class="tbl"><tr><th>فروشنده</th><th>فاکتور/ردیف</th><th>مبلغ</th><th>اولین خرید</th><th>آخرین خرید</th></tr>${by.map(x=>{let rs=x.rows.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<tr><td>${esc(x.name)}</td><td>${fmt(x.count)}</td><td>${compact(x.amount)}</td><td>${esc(rs[0]?.date)}</td><td>${esc(rs.at(-1)?.date)}</td></tr>`}).join('')}</table></div></div>`}
function category(){const a=filtered(),cats=topRows(a,'item',9999);return hero(state.category,'صفحه اختصاصی دسته؛ تمام تحلیل‌های این دسته را همین‌جا ببین.',true)+`<div class="kpis">${kpi('مجموع خرید',compact(sum(a,'amount')))}${kpi('مقدار',fmt(sum(a,'qty')))}${kpi('کالا',fmt(uniq(a.map(r=>r.itemCode||r.item)).length))}${kpi('فروشنده',fmt(uniq(a.map(r=>r.supplier)).length))}</div><div class="grid2"><div class="panel"><h3>پرهزینه‌ترین کالاهای دسته</h3>${miniBar(cats.slice(0,10),'amount')}</div><div class="panel"><h3>پرمصرف‌ترین کالاهای دسته</h3>${miniBar(cats.slice().sort((x,y)=>y.qty-x.qty).slice(0,10),'qty')}</div></div><div class="panel"><h3>جزئیات کالاهای این دسته</h3><div class="tableWrap"><table class="tbl"><tr><th>کد</th><th>کالا</th><th>مقدار</th><th>مبلغ</th><th>دفعات</th></tr>${cats.slice(0,1000).map(x=>`<tr><td>${esc(x.rows[0].itemCode)}</td><td class="click" onclick="setView('profile',{item:'${esc(x.rows[0].itemCode).replace(/'/g,"\\'")}'} )">${esc(x.name)}</td><td>${fmt(x.qty)}</td><td>${compact(x.amount)}</td><td>${fmt(x.count)}</td></tr>`).join('')}</table></div></div>`}
function pivot(){const a=filtered(),items=topRows(a,'item',9999).sort((x,y)=>y.amount-x.amount),periods=uniq(a.map(r=>r.periodKey)).sort();return hero('Pivot تعاملی','نسخه وب همان منطق Pivot Excel: دسته → کالا → دوره، با مقدار، مبلغ و دفعات خرید.',false)+`<div class="panel"><div class="tableWrap"><table class="tbl"><tr><th>کالا</th>${periods.map(p=>`<th>${periodLabel(p)}</th>`).join('')}<th>جمع</th></tr>${items.slice(0,500).map(x=>`<tr><td class="click" onclick="setView('profile',{item:'${esc(x.rows[0].itemCode).replace(/'/g,"\\'")}'} )">${esc(x.name)}</td>${periods.map(p=>`<td>${compact(sum(x.rows.filter(r=>r.periodKey===p),'amount'))}</td>`).join('')}<td>${compact(x.amount)}</td></tr>`).join('')}</table></div></div>`}
function periodLabel(p){p=String(p);if(!p)return '';let y=Math.floor(Number(p)/10),s=Number(p)%10;return ['','بهار','تابستان','پاییز','زمستان'][s]+' '+y}
function render(){if(!state.data)return;nav();const views={dashboard, purchases,items,suppliers:supplierPage,compare,search:searchPage,reports,whatif,changes,ask,excluded,category,pivot,profile:profile,supplier:supplierProfile};const fn=views[state.view]||dashboard;document.getElementById('app').innerHTML=fn();document.getElementById('crumb').textContent=document.querySelector('.nav.active')?.innerText?.trim()||state.view}
fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{state.data=d;render()}).catch(e=>{document.getElementById('app').innerHTML='<div class="panel dangerBox">خطا در بارگذاری data.json. فایل index.html و data.json باید کنار هم در GitHub Pages باشند.</div>'});
</script></body></html>
