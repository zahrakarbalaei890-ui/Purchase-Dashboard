<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase Intelligence | داشبورد خرید</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
 --nav:#0b1220;--nav2:#111b2f;--accent:#19b5ae;--accent2:#3b82f6;--purple:#7c5cff;
 --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#748197;--line:#e5eaf1;
 --good:#0f9f72;--danger:#dc5a67;--warn:#d98b20;--shadow:0 14px 40px rgba(24,39,75,.08);
 --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:286px;background:linear-gradient(180deg,var(--nav),#0e1728 70%,#0b1220);color:#dfe8f6;padding:18px 14px;position:fixed;right:0;top:0;bottom:0;overflow:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#2563eb);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;box-shadow:0 10px 30px rgba(25,181,174,.2)}
.brand b{font-size:16px}.brand small{display:block;color:#91a0b8;font-size:10px;margin-top:4px}
.nav-title{font-size:10px;color:#71819a;padding:13px 10px 7px}
.nav button{width:100%;border:0;background:transparent;color:#c9d4e5;text-align:right;padding:11px 12px;border-radius:11px;margin:2px 0;display:flex;align-items:center;gap:10px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:linear-gradient(90deg,rgba(25,181,174,.2),rgba(59,130,246,.12));color:#fff;box-shadow:inset -3px 0 var(--accent)}
.nav .ico{width:25px;text-align:center;font-size:16px}
.main{margin-right:286px;width:calc(100% - 286px);padding:22px 26px 50px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top-left{display:flex;gap:10px;align-items:center}
.search-global{width:min(390px,42vw);background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 14px;outline:none;box-shadow:var(--shadow)}
.search-global:focus{border-color:var(--accent)}
.periods{display:flex;gap:7px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:13px}
.periods button{border:0;background:transparent;padding:8px 13px;border-radius:9px;color:var(--muted);font-weight:700}
.periods button.active{background:#e8fbf9;color:#087d77}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:10px 0 18px}
.page-head h1{margin:0;font-size:25px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.blue{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{background:#fff1f2;border-color:#ffd1d6;color:#b63242}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;left:-20px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:rgba(25,181,174,.07)}
.kpi .label{color:var(--muted);font-size:11px}.kpi .value{font-size:22px;font-weight:900;margin-top:8px;direction:rtl}.kpi .sub{font-size:10px;color:var(--muted);margin-top:7px}
.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 5px;font-size:14px}.panel .desc{font-size:10px;color:var(--muted);margin-bottom:12px}
.chart-wrap{height:290px;position:relative}.chart-wrap.sm{height:220px}.chart-wrap.lg{height:360px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:680px}
th{background:#f7f9fc;color:#657187;text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}tr.clickable:hover{background:#f7fcfc}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:700;background:#edf2f7;color:#536174}
.badge.good{background:#e9f8f1;color:#087d59}.badge.warn{background:#fff5df;color:#9a6411}.badge.danger{background:#fff0f2;color:#b63242}.badge.blue{background:#edf4ff;color:#245db8}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field.grow{flex:1}
.field label{font-size:10px;color:var(--muted)}
.field input,.field select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.hero{background:linear-gradient(135deg,#0c172a,#122743 58%,#0c3d49);color:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 45px rgba(10,28,52,.18);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:rgba(25,181,174,.12);left:-120px;top:-190px}
.hero h2{margin:0;font-size:22px}.hero p{color:#b9c7da;font-size:11px;max-width:720px;line-height:2;margin:8px 0 0}
.hero .hero-row{display:flex;justify-content:space-between;gap:20px;align-items:center;position:relative}
.hero-stat{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px}.hero-stat div{min-width:120px}.hero-stat b{display:block;font-size:17px}.hero-stat span{color:#9db0c8;font-size:9px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:10px;color:var(--muted)}
.link{border:0;background:none;color:#087d77;font-size:10px;font-weight:700}
.empty{padding:35px;text-align:center;color:var(--muted)}
.item-title{font-weight:800;color:#1a2740}.money{font-variant-numeric:tabular-nums;white-space:nowrap}.muted{color:var(--muted)}
.progress{height:8px;border-radius:999px;background:#edf1f5;overflow:hidden;min-width:90px}.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.price-up{color:#c83c4e;font-weight:800}.price-down{color:#0c946a;font-weight:800}
.tagbar{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px}.tag.active{background:#e9f8f6;border-color:#bdebe6;color:#087d77}
.detail-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.detail-card{padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.detail-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mini{padding:12px;background:#f7f9fc;border-radius:12px}.mini small{color:var(--muted);font-size:9px}.mini b{display:block;margin-top:5px;font-size:13px}
.note{background:#fffaf0;border:1px solid #f4dfad;border-radius:13px;padding:12px;font-size:10px;color:#785916;line-height:2}
.alert-card{border-right:4px solid var(--danger)}.success-card{border-right:4px solid var(--good)}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.pill-tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;font-size:10px}.pill-tabs button.active{background:#172b45;color:#fff;border-color:#172b45}
.drawer{position:fixed;inset:0;background:rgba(7,15,28,.45);display:none;z-index:60}.drawer.open{display:block}.drawer-card{position:absolute;right:0;top:0;bottom:0;width:min(680px,94vw);background:#fff;padding:20px;overflow:auto;box-shadow:-15px 0 45px rgba(0,0,0,.2)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:15px}.drawer-head h2{font-size:18px;margin:0}
.toast{position:fixed;left:24px;bottom:24px;background:#172033;color:#fff;padding:11px 15px;border-radius:11px;box-shadow:var(--shadow);display:none;z-index:100;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(7,15,28,.52);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:20px;width:min(900px,96vw);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.close{border:0;background:#f1f4f8;border-radius:10px;padding:8px 11px}
.dna{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.dna-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.dna-card h4{margin:0 0 10px;font-size:12px}.meter{margin:9px 0}.meter-top{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px}.meter-bar{height:9px;background:#edf1f5;border-radius:999px;overflow:hidden}.meter-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--purple));border-radius:999px}
.matrix{overflow:auto}.matrix table{min-width:1000px}.heat{padding:7px;border-radius:7px;text-align:center;font-weight:700}
.ask{display:flex;gap:8px}.ask input{flex:1;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 13px}.answer{background:#f4faf9;border:1px solid #d4f0ec;border-radius:15px;padding:15px;line-height:2;font-size:11px}
.switch{display:flex;gap:6px}.switch button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:10px}.switch button.active{background:#0f9f72;color:#fff;border-color:#0f9f72}
.mobile-menu{display:none}
@media(max-width:1100px){.sidebar{width:230px}.main{margin-right:230px;width:calc(100% - 230px)}.kpis{grid-template-columns:repeat(2,1fr)}.four,.dna{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
 .sidebar{transform:translateX(100%);transition:.2s;width:280px}.sidebar.open{transform:translateX(0)}
 .main{margin-right:0;width:100%;padding:15px}.mobile-menu{display:block}.topbar{align-items:stretch;flex-wrap:wrap}.search-global{width:100%;order:3}.periods{overflow:auto}.two,.three,.detail-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.four,.dna,.detail-kpis{grid-template-columns:1fr 1fr}.page-head{align-items:start;flex-direction:column}
}
@media(max-width:430px){.kpis,.four,.dna,.detail-kpis{grid-template-columns:1fr}.hero .hero-row{flex-direction:column;align-items:flex-start}}

/* Login screen inspired by the supplied Ramoos sign-in page */
.login-screen{position:fixed;inset:0;z-index:200;background:#f3f5f8;display:grid;grid-template-columns:1.2fr 1fr;direction:ltr}
.login-left{display:flex;align-items:center;justify-content:center;padding:28px;direction:rtl}
.login-card{width:min(390px,100%);background:#fff;border:1px solid #e2e7ee;border-radius:18px;padding:30px;box-shadow:0 10px 26px rgba(18,32,55,.08)}
.login-card h2{font-size:20px;margin:0 0 8px;color:#202b3d}.login-card .hint{font-size:11px;color:#8b96a8;margin:0 0 28px;line-height:2}
.login-field{display:block;margin:15px 0}.login-field span{display:block;font-size:11px;color:#4e5b70;margin-bottom:8px;font-weight:700}
.login-field input{width:100%;height:46px;border:1px solid #e0e5ec;border-radius:10px;background:#f8fafc;padding:0 14px;outline:none;font-size:13px}
.login-field input:focus{border-color:#2864e8;box-shadow:0 0 0 3px rgba(40,100,232,.1)}
.login-submit{width:100%;height:46px;border:0;border-radius:10px;background:#215be3;color:#fff;font-weight:800;box-shadow:0 8px 18px rgba(33,91,227,.2);margin-top:8px}
.login-error{font-size:11px;color:#c43b4a;min-height:18px;margin-top:10px}
.login-foot{font-size:10px;color:#9aa4b4;text-align:center;margin-top:18px}
.login-brand{background:linear-gradient(155deg,#101b37,#203f9c);color:#fff;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden;direction:rtl}
.login-brand:before{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.13);border-radius:50%;right:-150px;bottom:-160px}
.login-brand-inner{position:relative;z-index:1;width:min(430px,100%)}
.login-logo{width:64px;height:64px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);border-radius:18px;display:grid;place-items:center;font-size:27px;font-weight:900;margin-bottom:26px}
.login-brand h1{font-size:31px;margin:0 0 12px}.login-brand p{font-size:13px;color:#c7d2ec;line-height:2;margin:0}
.upload-drop{border:1.5px dashed #b8c7d9;border-radius:18px;padding:28px;text-align:center;background:#f8fbff;cursor:pointer;transition:.15s}
.upload-drop:hover{border-color:var(--accent2);background:#f2f7ff}.upload-drop .upload-icon{font-size:32px;margin-bottom:8px}.upload-drop strong{display:block;margin-bottom:6px}.upload-drop small{color:var(--muted);line-height:2}
.upload-status{border-radius:12px;padding:12px 14px;background:#f1f7ff;color:#36516f;font-size:11px;line-height:2;margin-top:12px}
.upload-status.good{background:#eaf8f1;color:#126d4c}.upload-status.bad{background:#fff0f1;color:#a52b3b}
.dashboard-periods{margin:0 0 14px;display:inline-flex}.dash-topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
@media(max-width:760px){.login-screen{grid-template-columns:1fr}.login-brand{display:none}.login-left{padding:18px}.login-card{padding:25px}}


/* Dashboard V8 refinements */
.topbar-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.topbar-actions .btn{padding:8px 11px;font-size:10px}
.kpis.kpis-main{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis-main .kpi{padding:20px 18px;min-height:116px}
.kpis-main .kpi .label{font-size:11px}
.kpis-main .kpi .value{font-size:27px;line-height:1.35}
.kpis-main .kpi .sub{font-size:10px}
.hero.dashboard-hero{padding:24px 26px}
.hero.dashboard-hero h2{font-size:25px}
.hero.dashboard-hero .hero-row{align-items:flex-start}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.trend-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.trend-periods{display:flex;gap:5px;background:#f6f8fb;border:1px solid var(--line);padding:4px;border-radius:11px}
.trend-periods button{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:800;padding:7px 10px;border-radius:8px}
.trend-periods button.active{background:#172b45;color:#fff}
.dashboard-section{margin-top:22px}
.dashboard-section .section-title{margin:0 0 10px}
.category-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.category-card{border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#fff,#fbfcfe);padding:12px}
.category-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid #eef1f5}
.category-card-head b{font-size:12px}
.category-card-head span{font-size:9px;color:var(--muted)}
.rank-block{margin-top:8px}
.rank-block-title{font-size:9px;color:var(--muted);font-weight:800;margin-bottom:5px}
.rank-row{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed #edf0f4;font-size:10px}
.rank-row:last-child{border-bottom:0}
.rank-no{width:20px;height:20px;border-radius:7px;background:#eef4fb;display:grid;place-items:center;color:#42617e;font-size:9px;font-weight:900}
.rank-row .rank-name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.rank-row .rank-val{font-weight:900;white-space:nowrap}
.supplier-radar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.supplier-card{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;cursor:pointer;transition:.15s}
.supplier-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(24,39,75,.08);border-color:#cfe5e4}
.supplier-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.supplier-top b{font-size:11px;line-height:1.7}
.supplier-card .supplier-rank{width:27px;height:27px;border-radius:9px;background:#edf4ff;color:#245db8;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}
.supplier-metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.supplier-metric{background:#f7f9fc;border-radius:10px;padding:8px}
.supplier-metric small{display:block;color:var(--muted);font-size:8px;margin-bottom:3px}
.supplier-metric b{font-size:10px}
.alert-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.alert-list{display:grid;gap:7px}
.alert-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.alert-item .alert-main{min-width:0}
.alert-item .alert-main b{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-item .alert-main span{display:block;color:var(--muted);font-size:9px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-value{font-weight:900;font-size:10px;white-space:nowrap}
.alert-value.up{color:#c83c4e}.alert-value.down{color:#0c946a}
.dashboard-share{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.share-list{display:grid;gap:7px}
.share-row{display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:8px;padding:8px;border-radius:11px;background:#f8fafc}
.share-row .bar{height:7px;border-radius:999px;background:#e8edf3;overflow:hidden;margin-top:4px}
.share-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
@media(max-width:1100px){
 .kpis.kpis-main{grid-template-columns:repeat(3,minmax(0,1fr))}
 .category-board,.supplier-radar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
 .kpis.kpis-main{grid-template-columns:1fr 1fr}
 .category-board,.supplier-radar,.alert-grid,.dashboard-share{grid-template-columns:1fr}
 .topbar-actions{width:100%;justify-content:flex-start}
}
@media(max-width:430px){.kpis.kpis-main{grid-template-columns:1fr}}

</style>
</head>
<body>
<section class="login-screen" id="loginScreen" aria-label="ورود به داشبورد">
 <div class="login-left"><form class="login-card" id="loginForm">
  <h2>ورود به داشبورد</h2><p class="hint">برای ادامه، اطلاعات حساب خود را وارد کنید.</p>
  <label class="login-field"><span>نام کاربری</span><input id="loginUser" autocomplete="username" placeholder="نام کاربری خود را وارد کنید" required></label>
  <label class="login-field"><span>رمز عبور</span><input id="loginPass" type="password" autocomplete="current-password" placeholder="رمز عبور خود را وارد کنید" required></label>
  <button class="login-submit" type="submit">↪ ورود به سیستم</button><div class="login-error" id="loginError" aria-live="polite"></div>
  <div class="login-foot">© راموز — سامانه مدیریت هوشمند خرید</div>
 </form></div>
 <div class="login-brand"><div class="login-brand-inner"><div class="login-logo" id="loginLogo">ر</div><h1>راموز</h1><p>سامانه هوشمند تحلیل و مدیریت خرید<br>شرکت پرورش ماهی راموز</p></div></div>
</section>

<div class="app" id="mainApp" style="display:none">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">PI</div><div><b>Purchase Intelligence</b><small>سیستم هوشمند تحلیل خرید</small></div></div>
 <div class="nav" id="nav">
  <div class="nav-title">مدیریت</div>
  <button data-page="dashboard" class="active"><span class="ico">◈</span>داشبورد مدیریت</button>

<script>
let DATA=null, rows=[], exRows=[], charts={}, uploadedData=false, state={page:'dashboard',period:'12',query:'',cat:'همه',item:'',supplier:'',whatifRange:'همه خریدها',whatifScenario:'کاهش درصدی',whatifPeriod:'12',whatifValue:5};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const faDigits=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

const moneyShort=n=>{n=Number(n)||0; if(Math.abs(n)>=1e9)return (n/1e9).toFixed(1)+' میلیارد'; if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+' میلیون'; return money(n)};

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',2400)}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}
function makeChart(id,type,labels,datasets,opts={}){const el=document.getElementById(id);if(!el||!window.Chart)return;charts[id]=new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Tahoma',size:10}}}},scales:type==='doughnut'||type==='pie'?{}:{x:{ticks:{font:{family:'Tahoma',size:9}}},y:{ticks:{font:{family:'Tahoma',size:9},callback:v=>num(v)}}},...opts}})}
function parseDate(r){return [r.year,r.month,r.day]}
function idx(r){return r.year*12+r.month}
const maxIdx=()=>rows.reduce((m,r)=>Math.max(m,idx(r)),0);
function periodBounds(p){const mx=maxIdx();if(p==='all')return [Math.min(...rows.map(idx)),mx];const n=Number(p);return [mx-n+1,mx]}
function inPeriod(r,p=state.period){const [a,b]=periodBounds(p);return idx(r)>=a&&idx(r)<=b}
function filteredRows(extra={}){let p=extra.period||state.period,cat=extra.cat??state.cat,q=extra.query??state.query,sup=extra.supplier??state.supplier;return rows.filter(r=>inPeriod(r,p)&&(!cat||cat==='همه'||r.category===cat)&&(!sup||sup==='همه'||r.supplier===sup)&&(!q||[r.item,r.supplier,r.invoice,r.itemCode,r.supplierCode,r.category].some(v=>String(v??'').toLowerCase().includes(String(q).toLowerCase()))))}
function groupSum(rs,key,val='amount'){const m=new Map();rs.forEach(r=>m.set(r[key],(m.get(r[key])||0)+Number(r[val]||0)));return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function groupCount(rs,key){const m=new Map();rs.forEach(r=>m.set(r[key],(m.get(r[key])||0)+1));return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function unique(arr){return [...new Set(arr)]}
function cats(){return unique(rows.map(r=>r.category)).sort((a,b)=>a.localeCompare(b,'fa'))}
function suppliers(){return unique(rows.map(r=>r.supplier)).sort((a,b)=>a.localeCompare(b,'fa'))}
function items(){return unique(rows.map(r=>r.item)).filter(Boolean).sort((a,b)=>a.localeCompare(b,'fa'))}
function render(){destroyCharts();$('#sidebar').classList.remove('open');const fn={dashboard:renderDashboard,purchases:renderPurchases,items:renderItems,suppliers:renderSuppliers,'supplier-dna':renderDNA,compare:renderCompare,price:renderPrice,whatif:renderWhatIf,changed:renderChanged,ask:renderAsk,pivot:renderPivot,search:renderSearch,exceptions:renderExceptions,upload:renderUpload};(fn[state.page]||renderDashboard)();$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$$('#globalPeriods button,#dashPeriods button').forEach(b=>b.classList.toggle('active',b.dataset.period===state.period));$$('#dashPeriods button').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;render()})}

function renderDashboard(){
 const rs=filteredRows(), total=rs.reduce((s,r)=>s+r.amount,0), qty=rs.reduce((s,r)=>s+r.qty,0);
 const inv=unique(rs.map(r=>r.invoice||`${r.date}-${r.supplier}`)).length;
 const it=unique(rs.map(r=>r.itemCode||r.item)).length, sp=unique(rs.map(r=>r.supplier)).length;
 const months=unique(rs.map(r=>`${r.year}/${String(r.month).padStart(2,'0')}`)).sort();
 const monthMap=new Map(months.map(m=>[m,0]));
 rs.forEach(r=>{const k=`${r.year}/${String(r.month).padStart(2,'0')}`;monthMap.set(k,(monthMap.get(k)||0)+r.amount)});
 const catsum=groupSum(rs,'category'), topQty=groupSum(rs,'item','qty'), topAmount=groupSum(rs,'item','amount');

   a.changes.push(x); x.change>0?a.up++:a.down++; m.set(x.supplier,a); return m;
 },new Map());
 const changeSellers=[...sellerChanges.values()].sort((a,b)=>Math.max(...b.changes.map(x=>Math.abs(x.change)))-Math.max(...a.changes.map(x=>Math.abs(x.change)))).slice(0,6);

 $('#view').innerHTML=`

   <div class="actions">

 <div class="hero dashboard-hero">

    <div class="hero-actions"><button class="btn" onclick="go('whatif')">WHAT-IF</button><button class="btn" onclick="go('supplier-dna')">DNA فروشندگان</button><button class="btn" onclick="go('items')">شناسنامه کالا</button></div>

    <div class="trend-periods" id="trendPeriods">
      <button data-period="3">۳ ماهه</button><button data-period="6">۶ ماهه</button><button data-period="12">۱۲ ماهه</button><button data-period="all">کل دوره</button>
    </div>
   </div>
   <div class="chart-wrap" style="height:320px"><canvas id="trendChart"></canvas></div>
  </div>
 </div>

 <div class="dashboard-section">
  <div class="section-title"><h2>ترکیب خرید</h2><span>سهم هر دسته از کل مبلغ</span></div>

 <div class="dashboard-section">

 setTimeout(()=>{
   makeChart('trendChart','line',months.map(m=>m.replace('/','/')),[
    {label:'مبلغ خرید',data:months.map(m=>monthMap.get(m)||0),borderColor:'#19b5ae',backgroundColor:'rgba(25,181,174,.12)',fill:true,tension:.35,pointRadius:3,pointHoverRadius:6}
   ],{plugins:{tooltip:{callbacks:{label:c=>money(c.raw)}}},scales:{y:{ticks:{callback:v=>moneyShort(v),font:{family:'Tahoma',size:9}}}}});
   const vals=catsum.slice(0,10).map(x=>x[1]), labels=catsum.slice(0,10).map(x=>x[0]), totalCat=vals.reduce((a,b)=>a+b,0);
   const pctPlugin={id:'dashboardDonutPct',afterDatasetsDraw(chart){
     if(chart.config.type!=='doughnut')return;
     const {ctx}=chart;const meta=chart.getDatasetMeta(0);ctx.save();ctx.font='700 10px Tahoma';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
     meta.data.forEach((arc,i)=>{const v=vals[i]||0;if(!v||v/totalCat<.035)return;const p=arc.getCenterPoint();ctx.fillText(((v/totalCat)*100).toFixed(0)+'٪',p.x,p.y)});
     ctx.restore();
   }};
   makeChart('catChart','doughnut',labels,[{data:vals,backgroundColor:['#19b5ae','#3b82f6','#7c5cff','#f59e0b','#ef6472','#14b8a6','#64748b','#8b5cf6','#22c55e','#e11d48'],borderWidth:2}],{cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{family:'Tahoma',size:9},boxWidth:12,padding:10,generateLabels(chart){const ds=chart.data.datasets[0].data;return chart.data.labels.map((l,i)=>({text:`${l}  ${((ds[i]/totalCat)*100).toFixed(1)}٪`,fillStyle:ds[i]?chart.data.datasets[0].backgroundColor[i]:'#ddd',strokeStyle:'transparent',index:i}))}}},tooltip:{callbacks:{label:c=>`${c.label}: ${money(c.raw)} | ${((c.raw/totalCat)*100).toFixed(1)}٪`}}},plugins:[pctPlugin]});
   $$('#trendPeriods button').forEach(b=>{b.classList.toggle('active',b.dataset.period===state.period);b.onclick=()=>{state.period=b.dataset.period;render()}});
 },0);

function categoryHighlights(rs){
 const catsList=cats();
 return catsList.map(cat=>{
   const rr=rs.filter(r=>r.category===cat);
   const q=groupSum(rr,'item','qty').slice(0,3), a=groupSum(rr,'item','amount').slice(0,3);
   if(!q.length&&!a.length)return '';
   const findUnit=name=>rr.find(r=>r.item===name)?.unit||'';
   const list=(arr,mode)=>arr.map((x,i)=>`<div class="rank-row" onclick="openItem('${attr(x[0])}')"><span class="rank-no">${i+1}</span><span class="rank-name" title="${esc(x[0])}">${esc(x[0])}</span><span class="rank-val">${mode==='qty'?num(x[1])+' '+esc(findUnit(x[0])):money(x[1])}</span></div>`).join('');
   return `<div class="category-card"><div class="category-card-head"><b>${esc(cat)}</b><span>${num(rr.reduce((s,r)=>s+r.amount,0))} ریال</span></div>
    <div class="rank-block"><div class="rank-block-title">پرمصرف‌ترین</div>${list(q,'qty')||'<div class="muted" style="font-size:9px">داده‌ای نیست</div>'}</div>

   </div>`;
 }).join('');
}
function supplierCards(topAmount,topCount,rs){
 const names=unique([...topAmount.slice(0,6).map(x=>x[0]),...topCount.slice(0,6).map(x=>x[0])]).slice(0,8);
 const total=rs.reduce((s,r)=>s+r.amount,0);
 return names.map((name,i)=>{
   const amount=groupSum(rs.filter(r=>r.supplier===name),'supplier')[0]?.[1]||0;
   const count=rs.filter(r=>r.supplier===name).length, share=total?amount/total:0;
   return `<div class="supplier-card" onclick="openSupplier('${attr(name)}')"><div class="supplier-top"><b>${esc(name)}</b><span class="supplier-rank">${i+1}</span></div>
    <div class="supplier-metrics"><div class="supplier-metric"><small>مبلغ خرید</small><b>${money(amount)}</b></div><div class="supplier-metric"><small>تعداد خرید</small><b>${num(count)} ردیف</b></div></div>
    <div style="margin-top:9px"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)"><span>سهم از خرید</span><b>${pct(share)}</b></div><div class="progress" style="margin-top:5px"><i style="width:${Math.min(100,share*100*4)}%"></i></div></div>
   </div>`;
 }).join('');
}

 return `<div class="alert-list">${a.length?a.map(x=>`<div class="alert-item clickable" onclick="openItem('${attr(x.item)}')"><div class="alert-main"><b>${esc(x.item)}</b><span>${esc(x.supplier)} · فاصله ${num(x.gap)} روز · ${money(x.old)} → ${money(x.new)}</span></div><div class="alert-value ${x.change>0?'up':'down'}">${x.change>0?'▲':'▼'} ${pct(Math.abs(x.change))}</div></div>`).join(''):'<div class="empty">در خریدهای با فاصله حداکثر ۶۰ روز، موردی پیدا نشد.</div>'}</div>`;

}

 $('#view').innerHTML=`${head('دفتر خریدها','ریز تمام خریدهای واقعی؛ مبلغ و نرخ همیشه کامل و با واحد ریال نمایش داده می‌شوند.',`<button class="btn primary" onclick="exportCurrent()">خروجی CSV</button>`)}

function dnaForSupplier(name,rs){
 const mine=rs.filter(r=>r.supplier===name), all=rs;
 const amount=mine.reduce((s,r)=>s+r.amount,0), count=mine.length, maxAmt=Math.max(...groupSum(all,'supplier').map(x=>x[1]),1), maxCount=Math.max(...groupCount(all,'supplier').map(x=>x[1]),1);
 const months=new Set(mine.map(r=>`${r.year}/${r.month}`)).size;
 const itemMap=new Map();mine.forEach(r=>{const k=r.itemCode||r.item;let x=itemMap.get(k);if(!x)x=[];x.push(r.unitPrice);itemMap.set(k,x)});
 let stabilityVals=[];itemMap.forEach(v=>{if(v.length>1){const av=v.reduce((a,b)=>a+b,0)/v.length;const sd=Math.sqrt(v.reduce((a,b)=>a+(b-av)**2,0)/v.length);stabilityVals.push(Math.max(0,100-Math.min(100,(sd/(av||1))*100)))}});const stability=stabilityVals.length?stabilityVals.reduce((a,b)=>a+b,0)/stabilityVals.length:100;
 const avgMonths=Math.max(1,periodBounds(state.period)[1]-periodBounds(state.period)[0]+1);
 const share=amount/(all.reduce((s,r)=>s+r.amount,0)||1);
 const priceLevel=priceLevelForSupplier(name,rs);
 return {amount,count,items:new Set(mine.map(r=>r.itemCode||r.item)).size,cats:new Set(mine.map(r=>r.category)).size,months,priceLevel,weight:amount/maxAmt*100,activity:count/maxCount*100,stability,continuity:months/avgMonths*100,risk:share*100}
}
function priceLevelForSupplier(name,rs){
 const mine=rs.filter(r=>r.supplier===name);const byItem=new Map();rs.forEach(r=>{if(r.unitPrice>0){const k=r.itemCode||r.item;let a=byItem.get(k);if(!a)a=[];a.push(r.unitPrice);byItem.set(k,a)}});let vals=[];mine.forEach(r=>{if(!r.unitPrice)return;const avg=(byItem.get(r.itemCode||r.item)||[]);if(avg.length)vals.push(r.unitPrice/(avg.reduce((a,b)=>a+b,0)/avg.length)*50)});return vals.length?Math.min(100,vals.reduce((a,b)=>a+b,0)/vals.length):50
}

async function init(){
 try{
  const dataUrl=new URL('data.json',document.baseURI).href;
  const res=await fetch(dataUrl+'?v='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status+' — '+res.statusText);
  const raw=await res.text();
  try{DATA=JSON.parse(raw)}catch(parseErr){throw new Error('JSON Parse Error — '+parseErr.message+' | شروع پاسخ: '+raw.slice(0,80))}
  if(!DATA || !Array.isArray(DATA.rows)) throw new Error('ساختار data.json معتبر نیست: rows پیدا نشد.');
  rows=DATA.rows||[];exRows=DATA.excludedRows||[];buildCategoryNav();render();
 }catch(e){
  const msg=String(e?.message||e);
  $('#view').innerHTML='<div class="panel"><h2>خطا در بارگذاری داده</h2><p class="muted" style="line-height:2">'+esc(msg)+'</p><div class="detail-card" style="margin-top:14px"><b>مسیر مورد استفاده:</b><br><span dir="ltr" style="word-break:break-all">'+esc(new URL('data.json',document.baseURI).href)+'</span><br><br><b>تست:</b> همین آدرس را مستقیماً در مرورگر باز کن. اگر JSON باز شد، فایل سالم و قابل‌دسترسی است.</div></div>'
 }
}
