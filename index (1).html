<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راموز | داشبورد مدیریت خرید</title>
<style>
:root{--navy:#12365c;--blue:#1f6fb2;--purple:#6842a5;--bg:#f4f7fb;--card:#fff;--line:#e5ebf2;--text:#172334;--muted:#738091;--good:#22945a;--warn:#d48a16;--bad:#c84d4d;--shadow:0 8px 28px rgba(17,43,73,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.brand{background:linear-gradient(145deg,#12365c,#1b578d);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.logo{width:130px;height:130px;border:2px dashed rgba(255,255,255,.65);border-radius:28px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;font-size:14px}.brand h1{font-size:34px;margin:0 0 10px}.brand p{margin:0;opacity:.85;font-size:14px}.loginbox{display:flex;align-items:center;justify-content:center;padding:40px}.loginpanel{width:420px;max-width:100%;padding:18px}.loginpanel h2{font-size:28px;margin:0 0 8px;color:#203146}.loginpanel .lead{margin:0 0 28px;color:var(--muted);font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#5b6775;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid #d9e1ea;border-radius:11px;background:#fff;outline:0}.field input:focus,.field select:focus{border-color:#7aa6ce;box-shadow:0 0 0 3px rgba(31,111,178,.10)}.primary{background:var(--navy);color:white;padding:13px 16px;border-radius:11px;width:100%;font-weight:700}.loginmsg{height:24px;text-align:center;color:var(--bad);font-size:12px;margin-top:10px}
#app{display:none}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40}.topbrand{display:flex;align-items:center;gap:12px}.miniLogo{width:38px;height:38px;border-radius:11px;background:#e9f1fa;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700}.topbrand h1{font-size:18px;margin:0}.topbrand .sub{font-size:11px;color:var(--muted)}.logout{background:#eef3f8;color:var(--navy);padding:8px 12px;border-radius:9px;font-size:12px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:#fff;border-left:1px solid var(--line);padding:15px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.navTitle{font-size:11px;color:#9aa5b3;margin:10px 8px}.navBtn{width:100%;text-align:right;background:transparent;color:#415063;padding:11px 12px;border-radius:10px;margin:2px 0;font-size:12px}.navBtn:hover,.navBtn.active{background:#edf4fb;color:var(--navy);font-weight:700}.content{padding:22px;max-width:1700px;width:100%;margin:0 auto}.viewTitle{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:16px}.viewTitle h2{margin:0;font-size:22px}.viewTitle p{margin:4px 0 0;color:var(--muted);font-size:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:15px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.card .k{font-size:11px;color:var(--muted);margin-bottom:8px}.card .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.3}.card .hint{font-size:10px;color:var(--muted);margin-top:4px}.periods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.periodBtn{background:#fff;border:1px solid #d8e2ec;color:#43556a;padding:8px 14px;border-radius:20px;font-size:12px}.periodBtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.filters .full{grid-column:1/-1}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.chartBox{height:320px}.chartBox svg{width:100%;height:100%;display:block}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:#637083}.dot{width:9px;height:9px;border-radius:3px;display:inline-block}.donutWrap{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center}.donut{width:205px;height:205px;margin:auto}.bars .brow{display:grid;grid-template-columns:150px 1fr 100px;gap:8px;align-items:center;margin:8px 0}.bars .label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barTrack{height:10px;background:#edf2f7;border-radius:10px;overflow:hidden}.barFill{height:100%;border-radius:10px}.value{text-align:left;font-size:11px;color:#506075}.small{font-size:11px;color:var(--muted)}
.tableWrap{overflow:hidden;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}th,td{padding:10px 9px;border-bottom:1px solid #edf1f5;text-align:right;vertical-align:middle;word-break:break-word}th{background:#f3f7fb;color:#526173;font-weight:700;position:sticky;top:0;z-index:1}tbody tr:hover{background:#f9fbfd}.click{cursor:pointer}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf4fb;color:var(--navy);font-size:10px}.badge.good{background:#eaf7ef;color:var(--good)}.badge.warn{background:#fff6e5;color:var(--warn)}.badge.bad{background:#fdeeee;color:var(--bad)}
.compactTop{display:grid;grid-template-columns:1fr 1fr;gap:10px}.catTop{border:1px solid var(--line);border-radius:12px;padding:11px}.catTop h4{margin:0 0 7px;font-size:12px;color:var(--navy)}.topCols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.topCols .head{font-size:10px;color:var(--muted);margin-bottom:4px}.topCols div div{font-size:10px;line-height:1.8}
.detailGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:12px}.metric .k{font-size:10px;color:var(--muted)}.metric .v{margin-top:5px;font-size:15px;font-weight:800}.searchRow{display:grid;grid-template-columns:1fr auto;gap:8px}.listbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:8px}.listItem{padding:9px 11px;border-bottom:1px solid #eff2f5;font-size:11px;cursor:pointer}.listItem:hover,.listItem.active{background:#f0f6fc}.range2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.whatifGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.resultBig{background:#fff;border:1px solid var(--line);border-top:4px solid var(--purple);border-radius:13px;padding:14px}.resultBig .k{font-size:11px;color:var(--muted)}.resultBig .v{font-size:20px;font-weight:800;color:var(--purple);margin-top:6px}.info{padding:10px 12px;background:#faf6ff;border:1px solid #eadff8;border-radius:10px;color:#67587a;font-size:11px}.uploadBox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drop{border:2px dashed #b9c8d7;border-radius:14px;padding:20px;text-align:center;background:#fbfdff}.drop h3{margin:4px 0 8px}.actionRow{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#eef3f8;color:var(--navy);padding:9px 13px;border-radius:9px;font-size:11px}.danger{background:#fceeee;color:#b34a4a;padding:9px 13px;border-radius:9px;font-size:11px}.footerNote{text-align:center;color:#9aa5b3;font-size:10px;margin:22px 0}
@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.shell{grid-template-columns:200px 1fr}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.filters{grid-template-columns:repeat(3,1fr)}.detailGrid{grid-template-columns:repeat(2,1fr)}}

.serviceHero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}.serviceHero .heroPanel{background:linear-gradient(145deg,#6842a5,#8b62c9);color:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.heroPanel h3{margin:0 0 8px;font-size:16px}.heroPanel .heroNum{font-size:30px;font-weight:900;line-height:1.35}.heroPanel .heroSub{font-size:11px;opacity:.85}.serviceMiniGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.serviceMini{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.serviceMini .k{font-size:11px;color:var(--muted)}.serviceMini .v{font-size:20px;font-weight:800;color:var(--purple);margin-top:6px}.svcTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.svcTab{background:#fff;border:1px solid #dccff0;color:#67419e;padding:8px 14px;border-radius:20px;font-size:12px}.svcTab.active{background:var(--purple);border-color:var(--purple);color:#fff}.serviceFeature{background:#faf7ff;border:1px solid #e8ddf8;border-radius:12px;padding:12px}.serviceFeature strong{color:var(--purple)}
@media(max-width:800px){#login{grid-template-columns:1fr}.brand{display:none}.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-left:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:4px}.navTitle{display:none}.navBtn{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.content{padding:12px}.donutWrap{grid-template-columns:1fr}.whatifGrid,.uploadBox{grid-template-columns:1fr}.compactTop{grid-template-columns:1fr}}
@media(max-width:520px){.cards,.filters{grid-template-columns:1fr}.topbar{padding:0 12px}.topbrand .sub{display:none}.viewTitle h2{font-size:18px}.bars .brow{grid-template-columns:100px 1fr 78px}.detailGrid{grid-template-columns:1fr}.tableWrap{overflow:visible}table,thead,tbody,th,td,tr{display:block}thead{display:none}tbody tr{border-bottom:1px solid var(--line);padding:9px}tbody td{border:0;padding:4px 0;text-align:right;display:flex;justify-content:space-between;gap:8px;font-size:11px}tbody td:before{content:attr(data-label);font-weight:700;color:#7b8795;min-width:95px}.donut{width:180px}}
</style></head>
<body>
<div id="login">
 <div class="brand"><div class="logo">محل لوگوی شرکت</div><h1>راموز</h1><p>سامانه مدیریت هوشمند خرید</p></div>
 <div class="loginbox"><div class="loginpanel"><h2>ورود به داشبورد</h2><p class="lead">برای ادامه، اطلاعات حساب خود را وارد کنید</p><div class="field"><label>نام کاربری</label><input id="user" placeholder="نام کاربری خود را وارد کنید"></div><div class="field"><label>رمز عبور</label><input id="pass" type="password" placeholder="رمز عبور خود را وارد کنید"></div><button class="primary" id="loginBtn">ورود به سیستم</button><div class="loginmsg" id="loginMsg"></div></div></div>
</div>
<div id="app">
<header class="topbar"><div class="topbrand"><div class="miniLogo">ر</div><div><h1>داشبورد مدیریت خرید</h1><div class="sub">تحلیل تعاملی بر اساس فایل جدید اکسل</div></div></div><button class="logout" id="logout">خروج</button></header>
<div class="shell"><aside class="sidebar"><div class="navTitle">تحلیل و گزارش</div>
<button class="navBtn active" data-view="dashboard">داشبورد</button><button class="navBtn" data-view="purchaseBook">دفتر خریدها</button><button class="navBtn" data-view="services">خدمات</button><button class="navBtn" data-view="itemProfile">شناسنامه کالا / خدمت</button><button class="navBtn" data-view="supplierDNA">DNA فروشنده</button><button class="navBtn" data-view="supplierCompare">مقایسه فروشندگان</button><button class="navBtn" data-view="priceChanges">تغییر قیمت</button><button class="navBtn" data-view="gapAlerts">هشدار فاصله خرید</button><button class="navBtn" data-view="whatIf">What-If</button><button class="navBtn" data-view="whatChanged">What Changed</button><button class="navBtn" data-view="askData">AskData</button><button class="navBtn" data-view="exceptions">فروشندگان استثنا</button><button class="navBtn" data-view="advancedSearch">جستجوی پیشرفته</button><div class="navTitle">داده</div><button class="navBtn" data-view="dataCenter">مرکز داده و بارگذاری</button>
</aside><main class="content" id="content"></main></div></div>
<script>
let DATA=null, rows=[], excluded=[]; let state={view:'dashboard',range:'all'}; let snapshot=JSON.parse(localStorage.getItem('ramoozSnapshot')||'null');
const fa=n=>new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2}).format(Number(n)||0); const money=n=>fa(n)+' ریال';
const compact=n=>{n=Number(n)||0;if(Math.abs(n)>=1e12)return (n/1e12).toFixed(2)+' همت';if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2)+' میلیارد';if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+' میلیون';return fa(n)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const monthName=m=>['','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m]||'';
const season=m=>m<=3?'بهار':m<=6?'تابستان':m<=9?'پاییز':'زمستان';
const dateKey=s=>{const p=String(s).replaceAll('-','/').split('/');return p.length>=3?(+p[0])*10000+(+p[1])*100+(+p[2]):0};
function dayNum(y,m,d){y=y-979;let days=365*y+Math.floor(y/33)*8+Math.floor(((y%33)+3)/4);for(let mm=1;mm<m;mm++)days+=mm<=6?31:30;return days+d-1}
function rangeFilter(rs,range){if(range==='all')return rs;const max=Math.max(...rs.map(r=>r.monthIndex));const n=+range;return rs.filter(r=>r.monthIndex>=max-n+1)}
function unique(a){return [...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'fa'))}
function sum(rs,k){return rs.reduce((a,r)=>a+(+r[k]||0),0)}
function groupAgg(rs,key){const m=new Map();for(const r of rs){const k=r[key]||'نامشخص';let x=m.get(k);if(!x)m.set(k,x={key:k,amount:0,qty:0,count:0,invoice:new Set()});x.amount+=+r.amount||0;x.qty+=+r.qty||0;x.count++;if(r.invoice)x.invoice.add(r.invoice+'|'+r.supplier)}return [...m.values()]}
function periodButtons(active){return `<div class="periods">${[['3','3 ماه'],['6','6 ماه'],['12','12 ماه'],['all','کل دوره']].map(x=>`<button class="periodBtn ${active==x[0]?'active':''}" data-range="${x[0]}">${x[0]=='all'?'کل دوره':x[0]+' ماه'}</button>`).join('')}</div>`}
function hookPeriods(){document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;render()})}
function card(k,v,h=''){return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${h?`<div class="hint">${h}</div>`:''}</div>`}
function svgLine(points,width=700,height=290){if(!points.length)return `<div class="small">داده‌ای نیست</div>`;const max=Math.max(...points.map(p=>p.v),1),min=Math.min(...points.map(p=>p.v),0);const pad={l:38,r:16,t:18,b:38};const W=width-pad.l-pad.r,H=height-pad.t-pad.b;const x=i=>pad.l+(points.length===1?W/2:i*W/(points.length-1));const y=v=>pad.t+(max===min?H/2:(max-v)/(max-min)*H);let path='';points.forEach((p,i)=>path+=(i?' L':'M')+x(i)+' '+y(p.v));return `<svg viewBox="0 0 ${width} ${height}" role="img"><line x1="${pad.l}" y1="${pad.t+H}" x2="${width-pad.r}" y2="${pad.t+H}" stroke="#dfe6ee"/><path d="${path}" fill="none" stroke="#1f6fb2" stroke-width="3" stroke-linecap="round"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#fff" stroke="#1f6fb2" stroke-width="2"><title>${esc(p.l)}: ${money(p.v)}</title></circle><text x="${x(i)}" y="${height-12}" text-anchor="middle" font-size="9" fill="#748296">${esc(p.l)}</text>`).join('')}</svg>`}
function svgDonut(items,total){const r=78,cx=105,cy=105,c=2*Math.PI*r;let offset=0;const palette=['#1f6fb2','#6842a5','#269a6a','#d28a20','#cb5a5a','#4b829a','#7a6bb1','#8aa35b','#b35d8c','#5f78a7'];return `<svg class="donut" viewBox="0 0 210 210"><circle cx="105" cy="105" r="78" fill="none" stroke="#edf2f7" stroke-width="28"/>${items.map((it,i)=>{const len=c*(it.v/Math.max(total,1));const st=offset;offset+=len;return `<circle cx="105" cy="105" r="78" fill="none" stroke="${palette[i%palette.length]}" stroke-width="28" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-st}" transform="rotate(-90 105 105)"/>`}).join('')}<text x="105" y="101" text-anchor="middle" font-size="12" fill="#6d7988">کل خرید</text><text x="105" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#12365c">${compact(total)}</text></svg>`}
function renderDashboard(){const r=rangeFilter(rows,state.range);const goods=r.filter(x=>x.group==='کالا'),serv=r.filter(x=>x.group==='خدمات');const total=sum(r,'amount'),gTot=sum(goods,'amount'),sTot=sum(serv,'amount');const byMonth=groupAgg(r,'monthIndex').sort((a,b)=>a.key-b.key);const pts=byMonth.map(x=>{const mm=((x.key%12)||12),yy=Math.floor((x.key-1)/12);return {l:monthName(mm)+' '+yy,v:x.amount}});const cats=groupAgg(goods,'category').sort((a,b)=>b.amount-a.amount);const topCats=cats.slice(0,10);let catRows=cats.slice(0,10).map(x=>`<tr><td data-label="دسته">${esc(x.key)}</td><td data-label="مبلغ">${money(x.amount)}</td><td data-label="سهم">${fa(x.amount/gTot*100)}%</td></tr>`).join('');
 const supplier=groupAgg(r,'supplier').sort((a,b)=>b.amount-a.amount).slice(0,10);const price=priceChanges(r).slice(0,15);const gaps=gapList(r).slice(0,15);const catsTop=topByCategory(goods,8);
 return `<div class="viewTitle"><div><h2>داشبورد مدیریت خرید</h2><p>بر اساس فایل جدید؛ داده‌های «کلی» منبع اصلی هستند و فروشندگان استثنا جدا نگه داشته شده‌اند.</p></div></div>${periodButtons(state.range)}<div class="cards">${card('مجموع خرید',money(total),`کالا: ${money(gTot)}`)}${card('خرید کالا',money(gTot))}${card('خرید خدمات',money(sTot))}${card('تعداد فروشنده',fa(new Set(r.map(x=>x.supplier)).size))}${card('تعداد کالا',fa(new Set(r.map(x=>x.itemCode)).size))}${card('فاکتور یکتا',fa(new Set(r.filter(x=>x.invoice).map(x=>x.supplier+'|'+x.invoice)).size))}</div>
 <div class="grid2"><section class="panel"><h3>روند خرید ماهانه</h3><div class="chartBox">${svgLine(pts)}</div></section><section class="panel"><h3>ترکیب خرید</h3><div class="donutWrap"><div>${svgDonut([{v:gTot},{v:sTot}],total)}</div><div class="bars"><div class="brow"><div class="label">کالا</div><div class="barTrack"><div class="barFill" style="width:${total?gTot/total*100:0}%;background:#1f6fb2"></div></div><div class="value">${fa(total?gTot/total*100:0)}%</div></div><div class="brow"><div class="label">خدمات</div><div class="barTrack"><div class="barFill" style="width:${total?sTot/total*100:0}%;background:#6842a5"></div></div><div class="value">${fa(total?sTot/total*100:0)}%</div></div></div></div></section></div>
 <div class="grid2"><section class="panel"><h3>سهم هزینه‌ای دسته‌ها — کالا</h3><div class="tableWrap"><table><thead><tr><th>دسته</th><th>مبلغ</th><th>سهم از کالا</th></tr></thead><tbody>${catRows||'<tr><td colspan="3">موردی نیست</td></tr>'}</tbody></table></div></section><section class="panel"><h3>سهم هزینه‌ای دسته‌ها — خدمات</h3><div class="tableWrap"><table><thead><tr><th>دسته خدمت</th><th>مبلغ</th><th>سهم از خدمات</th></tr></thead><tbody>${groupAgg(serv,'category').sort((a,b)=>b.amount-a.amount).slice(0,10).map(x=>`<tr><td>${esc(x.key)}</td><td>${money(x.amount)}</td><td>${fa(sTot?x.amount/sTot*100:0)}%</td></tr>`).join('')||'<tr><td colspan="3">موردی نیست</td></tr>'}</tbody></table></div></section></div><div class="grid2"><section class="panel"><h3>پرمصرف‌ترین و پرهزینه‌ترین کالا در هر دسته</h3><div class="compactTop">${catsTop}</div></section><section class="panel"><h3>پرمصرف‌ترین و پرهزینه‌ترین خدمات</h3><div class="compactTop">${topServiceItems(serv,8)}</div></section></div>
 <div class="grid2"><section class="panel"><h3>فروشندگان با بیشترین مبلغ خرید</h3><div class="bars">${supplier.map((x,i)=>`<div class="brow"><div class="label">${esc(x.key)}</div><div class="barTrack"><div class="barFill" style="width:${supplier[0].amount?x.amount/supplier[0].amount*100:0}%;background:#1f6fb2"></div></div><div class="value">${compact(x.amount)}</div></div>`).join('')}</div></section><section class="panel"><h3>فروشندگان با بیشترین تغییر قیمت</h3><div class="tableWrap"><table><thead><tr><th>فروشنده</th><th>کالا</th><th>تغییر</th><th>فاصله</th></tr></thead><tbody>${price.slice(0,10).map(x=>`<tr class="click" onclick="openItem('${esc(x.code)}')"><td data-label="فروشنده">${esc(x.supplier)}</td><td data-label="کالا">${esc(x.item)}</td><td data-label="تغییر"><span class="badge ${x.pct>=0?'bad':'good'}">${x.pct>=0?'+':''}${fa(x.pct)}%</span></td><td data-label="فاصله">${fa(x.gap)} روز</td></tr>`).join('')||'<tr><td colspan="4">موردی نیست</td></tr>'}</tbody></table></div></section></div>
 <div class="grid2"><section class="panel"><h3>هشدار فاصله خرید</h3><div class="tableWrap"><table><thead><tr><th>کالا</th><th>آخرین خرید</th><th>قبلی</th><th>فاصله</th></tr></thead><tbody>${gaps.map(x=>`<tr><td data-label="کالا">${esc(x.item)}</td><td data-label="آخرین خرید">${x.last}</td><td data-label="قبلی">${x.prev}</td><td data-label="فاصله"><span class="badge warn">${fa(x.gap)} روز</span></td></tr>`).join('')||'<tr><td colspan="4">موردی نیست</td></tr>'}</tbody></table></div></section><section class="panel"><h3>حجم خرید بر اساس دوره</h3><div class="bars">${groupAgg(r,'period').sort((a,b)=>b.amount-a.amount).slice(0,12).map(x=>`<div class="brow"><div class="label">${esc(x.key)}</div><div class="barTrack"><div class="barFill" style="width:${Math.max(2,x.amount/(Math.max(...groupAgg(r,'period').map(y=>y.amount),1))*100)}%;background:#6842a5"></div></div><div class="value">${compact(x.amount)}</div></div>`).join('')}</div></section></div>`}
function topByCategory(rs,n){const m=new Map();for(const x of rs){if(!m.has(x.category))m.set(x.category,new Map());const q=m.get(x.category);const k=x.itemCode;let o=q.get(k);if(!o)q.set(k,o={item:x.item,unit:x.unit,qty:0,amount:0});o.qty+=+x.qty||0;o.amount+=+x.amount||0}return [...m.entries()].sort((a,b)=>[...b[1].values()].reduce((s,x)=>s+x.amount,0)-[...a[1].values()].reduce((s,x)=>s+x.amount,0)).slice(0,n).map(([cat,mi])=>{const a=[...mi.values()];const tq=[...a].sort((x,y)=>y.qty-x.qty).slice(0,3),ta=[...a].sort((x,y)=>y.amount-x.amount).slice(0,3);return `<div class="catTop"><h4>${esc(cat)}</h4><div class="topCols"><div><div class="head">پرمصرف‌ترین</div>${tq.map(x=>`<div>${esc(x.item)} — ${fa(x.qty)} ${esc(x.unit)}</div>`).join('')}</div><div><div class="head">پرهزینه‌ترین</div>${ta.map(x=>`<div>${esc(x.item)} — ${money(x.amount)}</div>`).join('')}</div></div></div>`})}
function priceChanges(rs){const m=new Map();for(const r of rs){const k=r.supplier+'|'+r.itemCode;if(!m.has(k))m.set(k,[]);m.get(k).push(r)}const out=[];for(const [k,l] of m){l.sort((a,b)=>dateKey(a.date)-dateKey(b.date));for(let i=1;i<l.length;i++){const a=l[i-1],b=l[i],gap=dayNum(b.year,b.month,parseInt(b.date.split('/')[2]||1))-dayNum(a.year,a.month,parseInt(a.date.split('/')[2]||1));if(a.unitPrice>0){out.push({supplier:b.supplier,item:b.item,code:b.itemCode,prev:a.unitPrice,next:b.unitPrice,pct:(b.unitPrice-a.unitPrice)/a.unitPrice*100,gap})}}}return out.filter(x=>x.gap<=60).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct))}
function gapList(rs){const m=new Map();for(const r of rs){if(!m.has(r.itemCode))m.set(r.itemCode,{item:r.item,dates:[]});m.get(r.itemCode).dates.push(r)}const out=[];for(const x of m.values()){const d=[...new Map(x.dates.map(r=>[r.date,r])).values()].sort((a,b)=>dateKey(a.date)-dateKey(b.date));if(d.length>=2){const a=d[d.length-2],b=d[d.length-1];const gap=dayNum(b.year,b.month,parseInt(b.date.split('/')[2]||1))-dayNum(a.year,a.month,parseInt(a.date.split('/')[2]||1));out.push({item:x.item,last:b.date,prev:a.date,gap})}}return out.filter(x=>x.gap>30 && x.gap<=60).sort((a,b)=>b.gap-a.gap)}
function renderPurchaseBook(){const cats=unique(rows.map(r=>r.category)),sups=unique(rows.map(r=>r.supplier));return `<div class="viewTitle"><div><h2>دفتر خریدها</h2><p>فیلتر، جستجو و مشاهده جزئیات هر خرید؛ مبالغ کامل به ریال.</p></div></div><section class="panel"><div class="filters"><div class="field"><label>گروه</label><select id="pbGroup"><option value="">همه</option><option>کالا</option><option>خدمات</option></select></div><div class="field"><label>دسته</label><select id="pbCat"><option value="">همه</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>فروشنده</label><select id="pbSup"><option value="">همه</option>${sups.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>جستجوی کالا</label><input id="pbSearch" placeholder="نام یا کد کالا"></div><div class="field"><label>بازه</label><select id="pbRange"><option value="all">کل دوره</option><option value="12">12 ماه</option><option value="6">6 ماه</option><option value="3">3 ماه</option></select></div></div></section><section class="panel"><div id="pbTable"></div></section>`}
function updatePurchaseBook(){const gr=document.getElementById('pbGroup'),ca=document.getElementById('pbCat'),su=document.getElementById('pbSup'),q=document.getElementById('pbSearch'),ra=document.getElementById('pbRange');if(!gr)return;let r=rangeFilter(rows,ra.value);r=r.filter(x=>(!gr.value||x.group===gr.value)&&(!ca.value||x.category===ca.value)&&(!su.value||x.supplier===su.value)&&(!q.value||x.item.includes(q.value)||x.itemCode.includes(q.value)));const html=`<div class="small" style="margin-bottom:8px">${fa(r.length)} ردیف</div><div class="tableWrap"><table><thead><tr><th>تاریخ</th><th>فروشنده</th><th>کالا</th><th>دسته</th><th>مقدار</th><th>نرخ واحد</th><th>مبلغ</th><th>فاکتور</th></tr></thead><tbody>${r.slice(0,800).map(x=>`<tr class="click" onclick="openItem('${esc(x.itemCode)}')"><td data-label="تاریخ">${x.date}</td><td data-label="فروشنده">${esc(x.supplier)}</td><td data-label="کالا">${esc(x.item)}</td><td data-label="دسته">${esc(x.category)}</td><td data-label="مقدار">${fa(x.qty)} ${esc(x.unit)}</td><td data-label="نرخ واحد">${money(x.unitPrice)}</td><td data-label="مبلغ">${money(x.amount)}</td><td data-label="فاکتور">${esc(x.invoice)||'—'}</td></tr>`).join('')}</tbody></table></div>${r.length>800?'<div class="small" style="margin-top:8px">برای عملکرد سریع‌تر، ۸۰۰ ردیف اول نمایش داده شده‌اند؛ از فیلترها استفاده کن.</div>':''}`;document.getElementById('pbTable').innerHTML=html}
function renderServices(){const r=rangeFilter(rows,state.range).filter(x=>x.group==='خدمات');const cats=groupAgg(r,'category').sort((a,b)=>b.amount-a.amount);const bySup=groupAgg(r,'supplier').sort((a,b)=>b.amount-a.amount).slice(0,12);const byItem=groupAgg(r,'item').sort((a,b)=>b.amount-a.amount).slice(0,12);const total=sum(r,'amount');const inv=new Set(r.filter(x=>x.invoice).map(x=>x.supplier+'|'+x.invoice)).size;const month=groupAgg(r,'monthIndex').sort((a,b)=>a.key-b.key).map(x=>{const mm=((x.key%12)||12),yy=Math.floor((x.key-1)/12);return{l:monthName(mm)+' '+yy,v:x.amount}});const price=priceChanges(r).slice(0,12);const gaps=gapList(r).slice(0,12);const svcTopCats=cats.slice(0,10).map(x=>`<tr><td>${esc(x.key)}</td><td>${money(x.amount)}</td><td>${fa(total?x.amount/total*100:0)}%</td><td>${fa(x.count)}</td></tr>`).join('');const topItemHtml=topServiceItems(r,10);return `<div class="viewTitle"><div><h2>مرکز خدمات</h2><p>تحلیل مستقل هزینه‌های خدمات همین فایل جدید؛ از آبدارخانه و حمل تا اسنپ، اقامت، تعمیرات و سایر خدمات.</p></div></div>${periodButtons(state.range)}<div class="serviceHero"><div class="heroPanel"><h3>مجموع خرید خدمات</h3><div class="heroNum">${money(total)}</div><div class="heroSub">${fa(r.length)} ردیف خدمات | ${fa(new Set(r.map(x=>x.supplier)).size)} فروشنده | ${fa(inv)} فاکتور یکتا</div></div><div class="serviceMiniGrid">${card('دسته خدمات',fa(new Set(r.map(x=>x.category)).size))}${card('نوع خدمت',fa(new Set(r.map(x=>x.itemCode)).size))}${card('مقدار کل',fa(sum(r,'qty')))}${card('میانگین هر ردیف',money(r.length?total/r.length:0))}</div></div><div class="grid2"><section class="panel"><h3>روند ماهانه خدمات</h3><div class="chartBox">${svgLine(month)}</div></section><section class="panel"><h3>سهم هزینه‌ای دسته‌های خدمات</h3><div class="tableWrap"><table><thead><tr><th>دسته خدمت</th><th>مبلغ</th><th>سهم</th><th>ردیف</th></tr></thead><tbody>${svcTopCats||'<tr><td colspan="4">موردی نیست</td></tr>'}</tbody></table></div></section></div><div class="grid2"><section class="panel"><h3>پرمصرف‌ترین و پرهزینه‌ترین خدمات</h3><div class="compactTop">${topItemHtml}</div></section><section class="panel"><h3>فروشندگان خدمات با بیشترین مبلغ</h3><div class="bars">${bySup.map(x=>`<div class="brow"><div class="label">${esc(x.key)}</div><div class="barTrack"><div class="barFill" style="width:${bySup[0].amount?x.amount/bySup[0].amount*100:0}%;background:#6842a5"></div></div><div class="value">${compact(x.amount)}</div></div>`).join('')}</div></section></div><div class="grid2"><section class="panel"><h3>تغییرات نرخ خدمات</h3>${tableRowsPrice(price)}</section><section class="panel"><h3>هشدار فاصله خرید خدمات</h3>${tableRows(gaps)}</section></div><section class="panel"><div class="serviceFeature"><strong>نکته:</strong> در این صفحه «خدمات» مستقل از کالا تحلیل می‌شود؛ بنابراین هزینه حمل و باربری، ایاب و ذهاب، آبدارخانه و پذیرایی، پیک و پست، رستوران، اقامت، تعمیرات و سایر دسته‌های خدمات در یک نمای مدیریتی واحد دیده می‌شوند.</div></section></div>`}
function topServiceItems(rs,n){const m=new Map();for(const x of rs){const k=x.itemCode;let o=m.get(k);if(!o)m.set(k,o={item:x.item,unit:x.unit,qty:0,amount:0});o.qty+=+x.qty||0;o.amount+=+x.amount||0}const arr=[...m.values()].sort((a,b)=>b.amount-a.amount).slice(0,n);return arr.map((x,i)=>`<div class="catTop"><h4>${i+1}. ${esc(x.item)}</h4><div class="topCols"><div><div class="head">مقدار</div><div>${fa(x.qty)} ${esc(x.unit)}</div></div><div><div class="head">مبلغ</div><div>${money(x.amount)}</div></div></div></div>`).join('')||'<div class="small">موردی نیست</div>'}
function renderItemProfile(code=''){const items=unique(rows.map(r=>r.itemCode));let selected=code||items[0]||'';const info=rows.find(r=>r.itemCode===selected)||null;return `<div class="viewTitle"><div><h2>شناسنامه کالا / خدمت</h2><p>تاریخچه خرید، قیمت، فروشنده اصلی و روند یک کالا یا خدمت.</p></div></div><section class="panel"><div class="searchRow"><input id="itemSelSearch" placeholder="کد یا نام کالا" value="${esc(info?info.item:'')}"><button class="secondary" id="itemFind">نمایش</button></div><div class="listbox" id="itemList"></div></section><div id="itemArea"></div>`}
function updateItemList(){const q=(document.getElementById('itemSelSearch')?.value||'').trim();const list=unique(rows.filter(r=>!q||r.item.includes(q)||r.itemCode.includes(q)).map(r=>r.itemCode)).slice(0,50);document.getElementById('itemList').innerHTML=list.map(c=>{const x=rows.find(r=>r.itemCode===c);return `<div class="listItem" data-code="${esc(c)}"><b>${esc(c)}</b> — ${esc(x?.item||'')}</div>`}).join('')||'<div class="small" style="padding:10px">موردی نیست</div>';document.querySelectorAll('.listItem').forEach(el=>el.onclick=()=>showItem(el.dataset.code))}
function showItem(code){const rs=rows.filter(r=>r.itemCode===code).sort((a,b)=>dateKey(a.date)-dateKey(b.date));if(!rs.length)return;const total=sum(rs,'amount'),q=sum(rs,'qty'),supp=groupAgg(rs,'supplier').sort((a,b)=>b.amount-a.amount);const uniqInv=new Set(rs.filter(r=>r.invoice).map(r=>r.supplier+'|'+r.invoice)).size;const last=rs[rs.length-1],prev=rs.length>1?rs[rs.length-2]:null;const changes=prev&&prev.unitPrice?((last.unitPrice-prev.unitPrice)/prev.unitPrice*100):0;const pts=groupAgg(rs,'monthIndex').sort((a,b)=>a.key-b.key).map(x=>{const m=((x.key%12)||12),y=Math.floor((x.key-1)/12);return{l:monthName(m),v:x.amount}});document.getElementById('itemArea').innerHTML=`<section class="panel"><h3>${esc(last.item)}</h3><div class="detailGrid">${card('گروه',esc(last.group||'—'))}${card('دسته',esc(last.category))}${card('تعداد خرید',fa(rs.length))}${card('مبلغ کل',money(total))}${card('مقدار کل',fa(q)+' '+esc(last.unit))}${card('آخرین نرخ',money(last.unitPrice))}${card('نرخ قبلی',prev?money(prev.unitPrice):'—')}${card('تغییر نرخ',prev?fa(changes)+'%':'—')}${card('فروشنده اصلی',esc(supp[0]?.key||'—'))}</div></section><div class="grid2"><section class="panel"><h3>روند مبلغ خرید</h3><div class="chartBox">${svgLine(pts)}</div></section><section class="panel"><h3>فروشندگان</h3><div class="bars">${supp.slice(0,12).map(x=>`<div class="brow"><div class="label">${esc(x.key)}</div><div class="barTrack"><div class="barFill" style="width:${supp[0].amount?x.amount/supp[0].amount*100:0}%;background:#269a6a"></div></div><div class="value">${compact(x.amount)}</div></div>`).join('')}</div></section></div><section class="panel"><h3>تاریخچه خرید</h3>${tableRows(rs)}</section>`}
function tableRows(rs){return `<div class="tableWrap"><table><thead><tr><th>تاریخ</th><th>فروشنده</th><th>فاکتور</th><th>مقدار</th><th>نرخ واحد</th><th>مبلغ</th><th>دسته</th></tr></thead><tbody>${rs.map(x=>`<tr><td data-label="تاریخ">${x.date}</td><td data-label="فروشنده">${esc(x.supplier)}</td><td data-label="فاکتور">${esc(x.invoice)||'—'}</td><td data-label="مقدار">${fa(x.qty)} ${esc(x.unit)}</td><td data-label="نرخ واحد">${money(x.unitPrice)}</td><td data-label="مبلغ">${money(x.amount)}</td><td data-label="دسته">${esc(x.category)}</td></tr>`).join('')}</tbody></table></div>`}
function renderDNA(){return `<div class="viewTitle"><div><h2>DNA فروشنده</h2><p>رفتار خرید هر فروشنده بر اساس مبلغ، فعالیت، ثبات قیمت و تداوم ماهانه.</p></div></div>${periodButtons(state.range)}<section class="panel"><div class="filters"><div class="field"><label>جستجوی فروشنده</label><input id="dnaQ"></div><div class="field"><label>گروه</label><select id="dnaGroup"><option value="">همه</option><option>کالا</option><option>خدمات</option></select></div></div></section><section class="panel"><div id="dnaTable"></div></section>`}
function dnaData(r){const total=sum(r,'amount');const bySup=groupAgg(r,'supplier').filter(x=>x.key);const maxAmt=Math.max(...bySup.map(x=>x.amount),1),maxCnt=Math.max(...bySup.map(x=>x.count),1);const monthSpan=Math.max(...r.map(x=>x.monthIndex),0)-Math.min(...r.map(x=>x.monthIndex),0)+1;return bySup.map(s=>{const rr=r.filter(x=>x.supplier===s.key);const priceChanges=[];const byItem=new Map();rr.forEach(x=>{if(!byItem.has(x.itemCode))byItem.set(x.itemCode,[]);byItem.get(x.itemCode).push(x)});for(const l of byItem.values()){l.sort((a,b)=>dateKey(a.date)-dateKey(b.date));for(let i=1;i<l.length;i++)if(l[i-1].unitPrice>0)priceChanges.push(Math.abs((l[i].unitPrice-l[i-1].unitPrice)/l[i-1].unitPrice*100))}const stability=Math.max(0,100-(priceChanges.reduce((a,b)=>a+b,0)/(priceChanges.length||1)));const months=new Set(rr.map(x=>x.monthIndex)).size;const continuity=Math.min(100,months/(monthSpan||1)*100);const level=Math.min(100,Math.max(0,50+((s.amount/Math.max(s.count,1))/(total/Math.max(r.length,1))-1)*50));let note=stability>=90?'قیمت نسبتاً باثبات':'نوسان قیمت محسوس';note+='؛ '+(s.count/maxCnt>=.6?'بسیار فعال':s.count/maxCnt>=.25?'فعال':'فعالیت کم');return {...s,weight:s.amount/maxAmt*100,activity:s.count/maxCnt*100,stability,continuity,share:s.amount/total*100,level,note,inv:s.invoice.size}})}
function updateDNA(){let r=rangeFilter(rows,state.range);const g=document.getElementById('dnaGroup'),q=document.getElementById('dnaQ');if(g&&g.value)r=r.filter(x=>x.group===g.value);let d=dnaData(r);if(q?.value)d=d.filter(x=>x.key.includes(q.value));d.sort((a,b)=>b.amount-a.amount);document.getElementById('dnaTable').innerHTML=tableDNA(d)}
function tableDNA(d){return `<div class="small" style="margin-bottom:8px">${fa(d.length)} فروشنده</div><div class="tableWrap"><table><thead><tr><th>فروشنده</th><th>سطح قیمت</th><th>وزن ریالی</th><th>فعالیت</th><th>ثبات قیمت</th><th>تداوم ماهانه</th><th>سهم خرید</th><th>مبلغ</th><th>ردیف خرید</th><th>فاکتور</th><th>تحلیل</th></tr></thead><tbody>${d.map(x=>`<tr class="click" onclick="state.supplier='${esc(x.key)}';state.view='supplierCompare';render()"><td data-label="فروشنده">${esc(x.key)}</td><td data-label="سطح قیمت">${fa(x.level)}</td><td data-label="وزن ریالی">${fa(x.weight)}%</td><td data-label="فعالیت">${fa(x.activity)}%</td><td data-label="ثبات قیمت">${fa(x.stability)}%</td><td data-label="تداوم ماهانه">${fa(x.continuity)}%</td><td data-label="سهم خرید">${fa(x.share)}%</td><td data-label="مبلغ">${money(x.amount)}</td><td data-label="ردیف خرید">${fa(x.count)}</td><td data-label="فاکتور">${fa(x.inv)}</td><td data-label="تحلیل">${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`}

function updateCompare(){const sel=document.getElementById('cmpSup'),chosen=[...sel.selectedOptions].map(o=>o.value);const r=rangeFilter(rows,state.range);const arr=chosen.map(s=>{const rr=r.filter(x=>x.supplier===s);return{name:s,amount:sum(rr,'amount'),count:rr.length,inv:new Set(rr.filter(x=>x.invoice).map(x=>x.invoice+'|'+s)).size,avg:sum(rr,'amount')/(sum(rr,'qty')||1)}}).sort((a,b)=>b.amount-a.amount);document.getElementById('cmpResult').innerHTML=arr.length?`<div class="bars">${arr.map(x=>`<div class="brow"><div class="label">${esc(x.name)}</div><div class="barTrack"><div class="barFill" style="width:${arr[0].amount?x.amount/arr[0].amount*100:0}%;background:#1f6fb2"></div></div><div class="value">${compact(x.amount)}</div></div>`).join('')}</div><br>${tableSimple(arr)}`:'<div class="small">فروشنده‌ای انتخاب نشده.</div>'}

function renderWhatIf(){const cats=unique(rows.map(r=>r.category)),items=unique(rows.map(r=>r.itemCode));return `<div class="viewTitle"><div><h2>What-If</h2><p>شبیه‌سازی کاهش قیمت بر اساس سابقه واقعی خریدهای همین فایل.</p></div></div><section class="panel"><div class="whatifGrid"><div class="field"><label>دامنه تحلیل</label><select id="wfMode"><option>همه خریدها</option><option>یک دسته</option><option>یک کالا</option></select></div><div class="field"><label>گروه</label><select id="wfGroup"><option>همه</option><option>کالا</option><option>خدمات</option></select></div><div class="field"><label>مورد تحلیل</label><select id="wfScope"><option>همه</option></select></div><div class="field"><label>بازه</label><select id="wfPeriod"><option value="12">12 ماه</option><option value="6">6 ماه</option><option value="3">3 ماه</option><option value="0">کل دوره</option></select></div><div class="field"><label>سناریو</label><select id="wfScen"><option>کاهش درصدی</option><option>کاهش مبلغ کل</option><option>قیمت واحد جدید</option></select></div><div class="field"><label>مقدار</label><input id="wfValue" value="5"></div><div class="field"><label>جستجو در لیست</label><input id="wfSearch" placeholder="نام کالا یا دسته"></div><div class="field"><label>&nbsp;</label><button class="primary" id="wfCalc">محاسبه کن</button></div></div></section><section class="panel"><div id="wfResult"></div></section>`}
function wfData(){let mode=document.getElementById('wfMode').value,group=document.getElementById('wfGroup').value,scope=document.getElementById('wfScope').value,period=+document.getElementById('wfPeriod').value,scen=document.getElementById('wfScen').value,v=+document.getElementById('wfValue').value||0;let r=rangeFilter(rows,period?String(period):'all');if(group!=='همه')r=r.filter(x=>x.group===group);if(mode==='یک دسته')r=r.filter(x=>x.category===scope);if(mode==='یک کالا')r=r.filter(x=>x.item===scope);const total=sum(r,'amount');const groupsK=new Map(),groupsS=new Map();let minM=1e9,maxM=0;for(const x of r){minM=Math.min(minM,x.monthIndex);maxM=Math.max(maxM,x.monthIndex);const key=mode==='یک کالا'?x.supplier:x.category;const d=x.group==='خدمات'?groupsS:groupsK;let o=d.get(key);if(!o)d.set(key,o={amount:0,qty:0,sav:0});o.amount+=x.amount;o.qty+=x.qty;if(scen==='قیمت واحد جدید'&&x.unitPrice>v)o.sav+=(x.unitPrice-v)*x.qty}let savings=0,p=0;if(scen==='کاهش درصدی'){p=v>1?v/100:v;savings=total*p}else if(scen==='کاهش مبلغ کل'){savings=Math.min(v,total);p=total?savings/total:0}else{for(const d of [groupsK,groupsS])for(const o of d.values())savings+=o.sav;p=total?savings/total:0}const span=Math.max(1,maxM-minM+1),annual=savings/span*12;return{total,savings,after:total-savings,annual,p,groupsK,groupsS,scope,mode,period,scen}}
function updateWFScope(){const m=document.getElementById('wfMode'),g=document.getElementById('wfGroup'),q=document.getElementById('wfSearch'),s=document.getElementById('wfScope');if(!m)return;let vals=m.value==='یک دسته'?unique(rows.filter(x=>g.value==='همه'||x.group===g.value).map(x=>x.category)):m.value==='یک کالا'?unique(rows.filter(x=>g.value==='همه'||x.group===g.value).map(x=>x.item)):['همه'];vals=vals.filter(x=>!q.value||x.includes(q.value));s.innerHTML=vals.map(x=>`<option>${esc(x)}</option>`).join('');}
function updateWF(){const d=wfData();const rowsK=[...d.groupsK.entries()].map(([k,v])=>({k,a:v.amount,s:d.scen==='قیمت واحد جدید'?v.sav:v.amount*d.p})).sort((a,b)=>b.s-a.s),rowsS=[...d.groupsS.entries()].map(([k,v])=>({k,a:v.amount,s:d.scen==='قیمت واحد جدید'?v.sav:v.amount*d.p})).sort((a,b)=>b.s-a.s);document.getElementById('wfResult').innerHTML=`<div class="whatifGrid"><div class="resultBig"><div class="k">خرید در بازه</div><div class="v">${money(d.total)}</div></div><div class="resultBig"><div class="k">صرفه‌جویی بالقوه</div><div class="v">${money(d.savings)}</div></div><div class="resultBig"><div class="k">خرید پس از کاهش</div><div class="v">${money(d.after)}</div></div><div class="resultBig"><div class="k">برآورد سالانه</div><div class="v">${money(d.annual)}</div></div></div><div class="info" style="margin:12px 0">${esc(d.mode)} | ${esc(d.scope)} | ${d.period?d.period+' ماه':'کل دوره'} | ${esc(d.scen)} | ${fa(d.scen==='کاهش درصدی'?d.p*100:d.p*100)}%</div><div class="grid2"><section><h3>جزئیات صرفه‌جویی — کالا</h3>${wfTable(rowsK)}</section><section><h3>جزئیات صرفه‌جویی — خدمات</h3>${wfTable(rowsS)}</section></div>`}
function wfTable(a){return `<div class="tableWrap"><table><thead><tr><th>گروه</th><th>خرید بازه</th><th>صرفه‌جویی</th><th>سهم</th></tr></thead><tbody>${a.map(x=>`<tr><td data-label="گروه">${esc(x.k)}</td><td data-label="خرید بازه">${money(x.a)}</td><td data-label="صرفه‌جویی">${money(x.s)}</td><td data-label="سهم">${fa((x.s/a.reduce((s,y)=>s+y.s,0))*100)}%</td></tr>`).join('')||'<tr><td colspan="4">موردی نیست</td></tr>'}</tbody></table></div>`}
function renderWhatChanged(){const current={amount:sum(rows,'amount'),rows:rows.length,suppliers:new Set(rows.map(x=>x.supplier)).size,items:new Set(rows.map(x=>x.itemCode)).size,date:new Date().toLocaleString('fa-IR')};let body='';if(snapshot){const itemNow=new Set(rows.map(x=>x.itemCode)), itemOld=new Set(snapshot.itemCodes||[]),supNow=new Set(rows.map(x=>x.supplier)),supOld=new Set(snapshot.suppliers||[]);const addedItems=[...itemNow].filter(x=>!itemOld.has(x)).length,goneItems=[...itemOld].filter(x=>!itemNow.has(x)).length,addedSup=[...supNow].filter(x=>!supOld.has(x)).length,goneSup=[...supOld].filter(x=>!supNow.has(x)).length;const pct=snapshot.amount?(current.amount-snapshot.amount)/snapshot.amount*100:0;body=`<div class="cards">${card('کالای جدید',fa(addedItems))}${card('کالای حذف‌شده',fa(goneItems))}${card('فروشنده جدید',fa(addedSup))}${card('فروشنده غیرفعال',fa(goneSup))}${card('تغییر مبلغ',fa(pct)+'%')}${card('تغییر تعداد ردیف',fa((rows.length/snapshot.rows-1)*100)+'%')}</div>`}else body='<div class="info">هنوز Snapshot قبلی برای وب ثبت نشده. یک Snapshot از داده فعلی بگیر تا از این به بعد تغییرات واقعی فایل‌های جدید را مقایسه کنیم.</div>';return `<div class="viewTitle"><div><h2>What Changed</h2><p>مقایسه این نسخه با Snapshot قبلی در مرورگر.</p></div></div><section class="panel">${body}<div class="actionRow" style="margin-top:12px"><button class="primary" style="width:auto" id="saveSnap">ثبت Snapshot فعلی</button>${snapshot?'<button class="danger" id="delSnap">حذف Snapshot</button>':''}</div></section><section class="panel"><h3>وضعیت فایل جاری</h3>${tableSimple([{name:'کل خرید',amount:current.amount,count:current.rows,inv:new Set(rows.filter(x=>x.invoice).map(x=>x.supplier+'|'+x.invoice)).size,avg:current.amount/(sum(rows,'qty')||1)}])}</section>`}

function ask(){const q=(document.getElementById('askQ').value||'').trim();const low=q.replace(/[؟?]/g,'');let r=rows,answer='';const year=(low.match(/140[0-9]/)||[])[0];if(year)r=r.filter(x=>x.year===+year);const monthNames={'فروردین':1,'اردیبهشت':2,'خرداد':3,'تیر':4,'مرداد':5,'شهریور':6,'مهر':7,'آبان':8,'آذر':9,'دی':10,'بهمن':11,'اسفند':12};let mm=Object.keys(monthNames).find(x=>low.includes(x));if(mm)r=r.filter(x=>x.month===monthNames[mm]);const six=/6\s*ماه/.test(low);if(six)r=rangeFilter(r,'6');if(/بیشترین.*فروشنده|فروشنده.*بیشترین/.test(low)){const a=groupAgg(r,'supplier').sort((x,y)=>y.amount-x.amount)[0];answer=a?`بیشترین مبلغ خرید مربوط به <b>${esc(a.key)}</b> با <b>${money(a.amount)}</b> است.`:'موردی پیدا نشد.'}else if(/قیمت.*(?:برنج|مرغ|گندم|ماهی)/.test(low)){let term=(low.match(/برنج|مرغ|گندم|ماهی/)||[])[0];const rr=r.filter(x=>x.item.includes(term));const a=rr[rr.length-1];answer=a?`آخرین نرخ ثبت‌شده برای «${esc(term)}» ${money(a.unitPrice)} در تاریخ ${a.date} بوده است.`:'برای این کالا موردی در داده فعلی پیدا نشد.'}else if(/چند.*خرید|چقدر.*خرید|مقدار/.test(low)){answer=`در محدوده سؤال، مجموع مقدار خرید <b>${fa(sum(r,'qty'))}</b> واحد ثبت شده است.`}else if(/لیست.*کالا|چه کالا/.test(low)){const a=unique(r.map(x=>x.item)).slice(0,40);answer=a.length?`کالاهای پیدا شده: ${a.map(esc).join('، ')}`:'موردی پیدا نشد.'}else{const a=groupAgg(r,'item').sort((x,y)=>y.amount-x.amount).slice(0,10);answer=a.length?`بر اساس مبلغ، اقلام پرتکرار این محدوده: ${a.map(x=>esc(x.key)).join('، ')}`:'سؤال با منطق فعلی قابل تفسیر نیست.'}document.getElementById('askResult').innerHTML=`<div class="info">${answer}</div>`}

function renderDataCenter(){return `<div class="viewTitle"><div><h2>مرکز داده و بارگذاری</h2><p>نسخه وب از داده‌های همین فایل ساخته شده؛ فایل JSON مرجع را می‌توانی خروجی بگیری یا نسخه‌ای را در همین مرورگر بارگذاری کنی.</p></div></div><section class="panel"><div class="uploadBox"><div class="drop"><h3>خروجی JSON</h3><p class="small">برای انتشار داده جدید در GitHub، این JSON را دانلود کن و جایگزین data.json کن.</p><div class="actionRow" style="justify-content:center"><button class="primary" style="width:auto" id="downloadJson">دانلود data.json</button></div></div><div class="drop"><h3>بارگذاری JSON</h3><p class="small">برای تست محلی یک data.json دیگر را وارد کن؛ داده فقط در همین مرورگر جایگزین می‌شود.</p><input type="file" id="jsonFile" accept=".json,application/json"></div></div></section><section class="panel"><h3>منبع فعلی</h3><div class="detailGrid">${card('ردیف اصلی',fa(rows.length))}${card('ردیف استثنا',fa(excluded.length))}${card('فروشنده اصلی',fa(new Set(rows.map(x=>x.supplier)).size))}${card('کالا',fa(new Set(rows.filter(x=>x.group==='کالا').map(x=>x.itemCode)).size))}${card('خدمت',fa(new Set(rows.filter(x=>x.group==='خدمات').map(x=>x.itemCode)).size))}${card('ردیف کالا',fa(rows.filter(x=>x.group==='کالا').length))}${card('ردیف خدمات',fa(rows.filter(x=>x.group==='خدمات').length))}</div><div class="info" style="margin-top:12px">نکته: چون GitHub Pages استاتیک است، بارگذاری Excel در مرورگر بدون کتابخانه پارسر XLSX انجام نمی‌شود. در این نسخه، JSON مرجع تعبیه شده تا وابستگی به CDN و VPN برای Parser نداشته باشیم.</div></section>`}
function downloadData(){const blob=new Blob([JSON.stringify(DATA)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();URL.revokeObjectURL(a.href)}
function bindView(){document.querySelectorAll('.navBtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));if(state.view==='dashboard'){hookPeriods()}if(state.view==='services'){hookPeriods()}if(state.view==='purchaseBook'){['pbGroup','pbCat','pbSup','pbSearch','pbRange'].forEach(id=>document.getElementById(id)?.addEventListener('input',updatePurchaseBook));updatePurchaseBook()}if(state.view==='itemProfile'){document.getElementById('itemFind')?.addEventListener('click',()=>{updateItemList();const first=document.querySelector('.listItem');if(first)showItem(first.dataset.code)});document.getElementById('itemSelSearch')?.addEventListener('input',updateItemList);updateItemList();const f=document.querySelector('.listItem');if(f)showItem(f.dataset.code)}if(state.view==='supplierDNA'){hookPeriods();document.getElementById('dnaQ')?.addEventListener('input',updateDNA);document.getElementById('dnaGroup')?.addEventListener('change',updateDNA);updateDNA()}if(state.view==='supplierCompare'){hookPeriods();document.getElementById('cmpGo')?.addEventListener('click',updateCompare)}if(state.view==='whatIf'){document.getElementById('wfMode')?.addEventListener('change',updateWFScope);document.getElementById('wfGroup')?.addEventListener('change',updateWFScope);document.getElementById('wfSearch')?.addEventListener('input',updateWFScope);document.getElementById('wfCalc')?.addEventListener('click',updateWF);updateWFScope()}if(state.view==='whatChanged'){document.getElementById('saveSnap')?.addEventListener('click',saveSnapshot);document.getElementById('delSnap')?.addEventListener('click',()=>{localStorage.removeItem('ramoozSnapshot');snapshot=null;render()})}if(state.view==='askData'){document.getElementById('askBtn')?.addEventListener('click',ask);document.getElementById('ex1')?.addEventListener('click',()=>{document.getElementById('askQ').value='کدام فروشنده بیشترین مبلغ را داشته؟';ask()})}if(state.view==='advancedSearch')document.getElementById('asGo')?.addEventListener('click',updateAdvanced);if(state.view==='dataCenter'){document.getElementById('downloadJson')?.addEventListener('click',downloadData);document.getElementById('jsonFile')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.rows)throw new Error('rows');DATA=d;rows=d.rows||[];excluded=d.excludedRows||[];render()}catch(_){alert('JSON معتبر نیست')}};rd.readAsText(f)})}}
function render(){let v=state.view;document.getElementById('content').innerHTML=v==='dashboard'?renderDashboard():v==='purchaseBook'?renderPurchaseBook():v==='services'?renderServices():v==='itemProfile'?renderItemProfile():v==='supplierDNA'?renderDNA():v==='supplierCompare'?renderSupplierCompare():v==='priceChanges'?renderPriceChanges():v==='gapAlerts'?renderGaps():v==='whatIf'?renderWhatIf():v==='whatChanged'?renderWhatChanged():v==='askData'?renderAskData():v==='exceptions'?renderExceptions():v==='advancedSearch'?renderAdvanced():renderDataCenter();bindView();window.scrollTo(0,0)}
function openItem(code){state.view='itemProfile';state.item=code;render();setTimeout(()=>showItem(code),50)}
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('ramoozOK');location.reload()};
async function boot(){try{const u=new URL('data.json',document.baseURI).href;const res=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);DATA=await res.json();rows=DATA.rows||[];excluded=DATA.excludedRows||[];render()}catch(e){document.getElementById('content').innerHTML=`<section class="panel"><h2>خطا در بارگذاری داده</h2><p class="small">${esc(e.message)}</p><p class="small">مسیر: ${esc(new URL('data.json',document.baseURI).href)}</p></section>`}}
function login(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value.trim();if(u==='admin'&&p==='1404'){sessionStorage.setItem('ramoozOK','1');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';boot()}else document.getElementById('loginMsg').textContent='نام کاربری یا رمز عبور اشتباه است'}
document.getElementById('loginBtn').onclick=login;document.getElementById('pass').onkeydown=e=>{if(e.key==='Enter')login()};if(sessionStorage.getItem('ramoozOK')==='1'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';boot()}
</script></body></html>
